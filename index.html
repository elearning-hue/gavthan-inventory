<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Gavthan Manager — Ledger &amp; Inventory</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg"/>
<link rel="icon" type="image/png" sizes="any" href="favicon.png"/>
<link rel="apple-touch-icon" href="favicon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>try{if(localStorage.getItem("gh-theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}</script>
<style>
  /* ═══════════════════════════════════════════════════════
     GAVTHAN MANAGER — SPATIAL DESIGN SYSTEM
     Depth-first UI: every surface lives at a measurable
     elevation; shadows encode altitude, not decoration.
     ═══════════════════════════════════════════════════════ */
  /* ─── Minimal modern tokens: neutral surfaces, hierarchy from color +
     spacing, hairline borders, one strong accent. Flat by default. ─── */
  :root{
    --bg:#f6f6f7; --surface:#ffffff; --surface-2:#f2f2f3; --surface-3:#e9e9eb;
    --ink:#17181a; --muted:#5b6067; --muted-2:#767c84;
    --line:#e7e8ea; --line-strong:#d4d6da;

    /* Brand — emerald, AA on white */
    --accent:#047857; --accent-600:#065f46; --accent-700:#064e3b;
    --accent-ink:#065f46; --accent-tint:#ecfdf5; --accent-tint-2:#d1fae5;
    --accent-fg:#ffffff;

    /* Semantic */
    --debit:#dc2626; --credit:#047857; --warn:#b45309;
    --red-bg:#fef2f2; --red-border:#fecaca;
    --green-bg:#ecfdf5; --green-border:#a7f3d0;
    --warn-bg:#fffbeb; --warn-border:#fde68a;
    --av-sup:#92610e; --toast-bg:#17181a; --toast-ink:#fafafa;

    /* Flat elevation scale — subtle, consistent */
    --sh-ground:none;
    --shadow-sm:0 1px 2px rgba(16,17,20,.05);
    --shadow:0 1px 3px rgba(16,17,20,.06),0 4px 12px rgba(16,17,20,.05);
    --shadow-lg:0 8px 30px rgba(16,17,20,.12);
    --shadow-float:0 4px 12px rgba(4,120,87,.18),0 12px 32px rgba(4,120,87,.16);
    --shadow-inset:none;

    --ring:0 0 0 2px var(--surface),0 0 0 4px var(--accent);
    --ring-err:0 0 0 2px var(--surface),0 0 0 4px var(--debit);

    --glass:rgba(255,255,255,.82);
    --glass-border:rgba(255,255,255,.6);
    --glass-blur:saturate(1.4) blur(10px);
    --glass-inner:none;

    --radius:12px; --radius-sm:8px; --radius-lg:16px;

    --ease-spring:cubic-bezier(.2,.8,.2,1.05);
    --ease-out:cubic-bezier(.16,1,.3,1);

    color-scheme:light;
  }
  :root[data-theme="dark"]{
    --bg:#0c0e11; --surface:#14171b; --surface-2:#1b1f24; --surface-3:#23282e;
    --ink:#eceef0; --muted:#9ba3ac; --muted-2:#7b838c;
    --line:#242930; --line-strong:#343b44;

    /* Dark: brighter emerald on dark, dark ink on primary buttons */
    --accent:#34d399; --accent-600:#4ade9f; --accent-700:#6ee7b7;
    --accent-ink:#a7f3d0; --accent-tint:#0d2b20; --accent-tint-2:#14402f;
    --accent-fg:#08130d;

    --debit:#f87171; --credit:#34d399; --warn:#fbbf24;
    --red-bg:#2a1414; --red-border:#5c2626;
    --green-bg:#0d2b20; --green-border:#1d5c40;
    --warn-bg:#2a2109; --warn-border:#5c4a14;
    --av-sup:#d0a04e; --toast-bg:#23282e; --toast-ink:#eceef0;

    --sh-ground:none;
    --shadow-sm:0 1px 2px rgba(0,0,0,.35);
    --shadow:0 1px 3px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.30);
    --shadow-lg:0 10px 40px rgba(0,0,0,.55);
    --shadow-float:0 4px 14px rgba(52,211,153,.14),0 12px 36px rgba(0,0,0,.45);
    --shadow-inset:none;

    --ring:0 0 0 2px var(--surface),0 0 0 4px var(--accent);
    --ring-err:0 0 0 2px var(--surface),0 0 0 4px var(--debit);

    --glass:rgba(20,23,27,.82);
    --glass-border:rgba(255,255,255,.06);
    --glass-blur:saturate(1.3) blur(12px);
    --glass-inner:none;
    --bg-glow:transparent;
    color-scheme:dark;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:14px;line-height:1.5;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  }

  /* ── Root shell: the app "lifts" off the page ── */
  #root{
    max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;
    background:var(--surface);
    box-shadow:0 0 0 1px var(--line);
    /* NOTE: do NOT set transform/filter/transform-style here — that would turn
       #root into the containing block for position:fixed/sticky descendants
       (FAB & sheet overlays), anchoring them to #root instead of the viewport. */
  }
  h1,h2,h3{font-family:inherit;font-weight:700;letter-spacing:-.02em;margin:0}
  .wrap{padding:0 14px 18px}
  .muted{color:var(--muted)}
  .tiny{font-size:12px}
  .nowrap{white-space:nowrap}
  .row{display:flex;align-items:center;gap:10px}
  .between{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .grow{flex:1;min-width:0}
  .ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ── Topbar — highest z-plane, thicker glass ── */
  .topbar{
    position:sticky;top:0;z-index:30;
    background:var(--glass);
    backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
    border-bottom:1px solid var(--line);
    padding:14px 18px;
    padding-top:max(14px,env(safe-area-inset-top));
    display:flex;align-items:center;gap:12px;
  }
  .brand{display:flex;flex-direction:column;line-height:1.3;gap:1px}
  .brand b{font-size:16.5px;font-weight:650;letter-spacing:-.015em}
  .brand span{font-size:11px;color:var(--muted);letter-spacing:.02em;font-weight:500}

  /* ── Crest: brand mark = favicon artwork ── */
  .crest{
    width:38px;height:38px;border-radius:10px;flex:0 0 auto;
    display:block;object-fit:contain;background:transparent;
  }

  /* ── Icon buttons — quiet until hovered ── */
  .iconbtn,.theme-toggle{
    border:1px solid transparent;
    background:transparent;
    border-radius:10px;width:44px;height:44px;
    display:grid;place-items:center;font-size:15px;color:var(--muted);cursor:pointer;
    transition:color .15s,background .15s,border-color .15s;
  }
  .iconbtn:hover,.theme-toggle:hover{color:var(--ink);background:var(--surface-2)}
  .iconbtn:active,.theme-toggle:active{background:var(--surface-3)}
  .theme-toggle{border-radius:50%}

  /* ── Module tabs — segmented control, soft active ── */
  .modtabs{display:flex;gap:4px;padding:12px 16px 0;background:transparent}
  .modtab{
    flex:1;display:flex;align-items:center;justify-content:center;gap:7px;
    border:1px solid transparent;background:transparent;
    border-radius:10px;padding:10px 8px;min-height:44px;
    text-align:center;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--muted);
    transition:color .15s,background .15s;
  }
  .modtab:hover:not(.on){color:var(--ink);background:var(--surface-2)}
  .modtab.on{
    background:var(--accent-tint);
    color:var(--accent-ink);
    border-color:var(--accent-tint-2);
  }

  /* ── Cards — flat surfaces, hairline separation ── */
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow-sm);
    margin-top:12px;overflow:hidden;
  }
  .card .hd{
    padding:12px 16px;
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;gap:8px;
  }
  .card .hd h3{font-size:14px;font-weight:650;letter-spacing:-.01em}
  .pad{padding:16px}

  /* ── Stat tiles — flat, data leads ── */
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .stat{
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:13px 14px;
  }
  .stat .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
  .stat .v{font-size:21px;font-weight:700;letter-spacing:-.02em;margin-top:4px}
  .stat .pend{font-size:10.5px;font-weight:600;color:var(--muted-2);margin-top:3px;line-height:1.3}
  .stat.green .v{color:var(--credit)} .stat.red .v{color:var(--debit)} .stat.warn .v{color:var(--warn)}

  /* ── List rows ── */
  .lrow{
    display:flex;align-items:center;gap:12px;padding:13px 16px;
    border-bottom:1px solid var(--line);cursor:pointer;
    transition:background .12s,transform .1s;
    position:relative;
  }
  .lrow::before{
    content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
    background:var(--accent);opacity:0;transition:opacity .15s;border-radius:0 3px 3px 0;
  }
  .lrow:hover{background:var(--surface-2)}
  .lrow:hover::before{opacity:.4}
  .lrow:last-child{border-bottom:0}
  .lrow:active{background:var(--surface-3);transform:scale(.995)}

  /* ── Avatar — flat tinted circle ── */
  .av{
    width:38px;height:38px;border-radius:50%;flex:0 0 auto;
    display:grid;place-items:center;font-weight:600;font-size:13.5px;
    background:var(--accent-tint-2);color:var(--accent-ink);
  }
  .av.sup{background:var(--warn-bg);color:var(--av-sup)}
  .amt{font-weight:650;font-size:15.5px;letter-spacing:-.01em}
  .amt.d{color:var(--debit)} .amt.c{color:var(--credit)}
  .pill{
    display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;
    border-radius:999px;border:1px solid var(--line);
    color:var(--muted);background:var(--surface-2);
  }
  .pill.low{color:var(--debit);border-color:var(--red-border);background:var(--red-bg)}
  .pill.ok{color:var(--credit);border-color:var(--green-border);background:var(--green-bg)}

  /* ── Buttons — flat solid, slim; press = subtle scale ── */
  button{font-family:inherit}
  .btn{
    appearance:none;
    background:var(--accent);
    border:1px solid var(--accent);color:var(--accent-fg);
    padding:11px 16px;min-height:44px;border-radius:10px;
    font-weight:600;font-size:14px;cursor:pointer;width:100%;
    transition:background .15s,border-color .15s,transform .1s var(--ease-out);
  }
  .btn:hover{background:var(--accent-600);border-color:var(--accent-600)}
  .btn:active{transform:scale(.98)}
  .btn.sec{
    background:var(--surface);color:var(--accent-ink);border-color:var(--line-strong);
  }
  .btn.sec:hover{background:var(--surface-2)}
  .btn.ghost{
    background:transparent;color:var(--muted);border-color:var(--line);
  }
  .btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
  .btn.danger{
    background:transparent;color:var(--debit);border-color:var(--red-border);
  }
  .btn.danger:hover{background:var(--red-bg)}
  .btn.sm{width:auto;padding:7px 12px;min-height:36px;font-size:13px;border-radius:8px}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important}

  /* ── Form controls — flat, clear focus ── */
  label{
    display:block;font-size:11px;font-weight:600;color:var(--muted);
    margin:14px 0 6px;text-transform:uppercase;letter-spacing:.05em;
  }
  input,select,textarea{
    width:100%;padding:11px 12px;min-height:44px;
    border:1px solid var(--line-strong);border-radius:10px;
    background:var(--surface);
    font-size:15px;font-family:inherit;color:var(--ink);
    transition:border-color .15s,box-shadow .15s;
  }
  input:focus,select:focus,textarea:focus{
    outline:none;border-color:var(--accent);box-shadow:var(--ring);
  }
  input::placeholder,textarea::placeholder{color:var(--muted-2)}

  /* ── Segmented control — soft active ── */
  .seg{display:flex;gap:4px}
  .seg button{
    flex:1;border:1px solid var(--line);background:transparent;
    border-radius:9px;padding:9px;min-height:40px;font-weight:600;font-size:13px;
    color:var(--muted);cursor:pointer;
    transition:color .15s,background .15s,border-color .15s;
  }
  .seg button:hover:not(.on){color:var(--ink);background:var(--surface-2)}
  .seg button.on{
    background:var(--accent-tint);color:var(--accent-ink);border-color:var(--accent-tint-2);
  }
  .seg.alt button.on{
    background:var(--red-bg);color:var(--debit);border-color:var(--red-border);
  }
  .search{position:relative;margin-top:12px}
  .search input{padding-left:38px}
  .search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.45}

  /* ── FAB — sticky: floats at the bottom of the viewport while scrolling,
     then settles below the pagination when you reach the end of the page. ── */
  .fab{
    position:sticky;
    bottom:max(20px,env(safe-area-inset-bottom));
    z-index:40;
    width:min(488px,calc(100% - 28px));
    margin:0 auto 20px;
  }
  .fab .btn{
    box-shadow:var(--shadow-float);
    border-radius:12px;
    font-size:14px;padding:12px 16px;
  }
  .fab .btn:active{transform:scale(.98)}

  /* ── Modal / bottom sheet — top-tier surface ── */
  .scrim{
    position:fixed;inset:0;
    background:rgba(15,10,4,.55);
    backdrop-filter:blur(6px) saturate(1.4);
    -webkit-backdrop-filter:blur(6px) saturate(1.4);
    z-index:50;display:flex;align-items:flex-end;justify-content:center;
  }
  .sheet{
    background:var(--surface);
    width:100%;max-width:520px;
    border-radius:16px 16px 0 0;
    max-height:92vh;overflow:auto;padding:6px 18px 28px;
    animation:sheetUp .24s var(--ease-out) both;
    box-shadow:var(--shadow-lg);
  }
  @keyframes sheetUp{
    from{transform:translateY(24px);opacity:0}
    to{transform:none;opacity:1}
  }
  .handle{
    width:36px;height:4px;border-radius:99px;
    background:var(--line-strong);
    margin:10px auto 6px;
  }
  .sheet h2{font-size:19px;font-weight:700;margin:6px 2px 2px;letter-spacing:-.02em}

  /* Sticky action footer inside a sheet — the primary button floats at the
     bottom of the popup while its content scrolls, and settles at the end. */
  .sheet-foot{
    position:sticky;
    bottom:-1px;
    margin:16px -18px -28px;
    padding:14px 18px max(18px,env(safe-area-inset-bottom));
    background:linear-gradient(180deg, transparent 0%, var(--surface) 30%);
    z-index:3;
  }

  /* ── Ledger entry line ── */
  .entry{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px dashed var(--line)}
  .entry:last-child{border-bottom:0}
  .dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:0 0 auto;
    box-shadow:0 1px 3px currentColor}
  .dot.d{background:var(--debit);color:var(--debit)}
  .dot.c{background:var(--credit);color:var(--credit)}

  .empty{text-align:center;color:var(--muted-2);padding:36px 16px}
  .empty .e{font-size:36px;display:block;margin-bottom:8px;opacity:.65}

  /* ── Ledger table ── */
  /* Dr/Cr sized for 6-digit figures with Indian grouping (e.g. 9,99,999) */
  .lthead,.ltrow{display:grid;grid-template-columns:58px 1fr 76px 76px 46px;gap:0;align-items:stretch;border-bottom:1px solid var(--line)}
  .lthead>*,.ltrow>*{display:flex;align-items:center;min-width:0;padding:10px 8px;border-right:1px solid var(--line)}
  .lthead>*:last-child,.ltrow>*:last-child{border-right:0}
  .lthead>*{justify-content:center;text-align:center}
  .lthead{
    font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;
    background:var(--surface-2);
    border-bottom:1px solid var(--line-strong);
  }
  .ltrow{transition:background .1s;cursor:pointer}
  .ltrow:last-child{border-bottom:0}
  .ltrow:hover{background:var(--surface-2)}
  .ltrow:active{background:var(--surface-3)}
  .ltrow:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--accent)}
  .ltrow-void{opacity:.55}
  .lt-date{font-size:10.5px;color:var(--muted);line-height:1.2;white-space:nowrap;overflow:hidden}
  .lt-desc{flex-direction:column;align-items:flex-start;justify-content:center;gap:1px}
  .lt-desc>*{max-width:100%}
  .lt-desc b{font-size:13px}
  .lt-desc .sub{font-size:10px;color:var(--muted)}
  .lt-amt{justify-content:flex-end;font-weight:650;font-size:12.5px;padding-left:5px;padding-right:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lt-dr{color:var(--credit)} .lt-cr{color:var(--debit)}
  .lt-setcell{justify-content:center}
  .setbtn{
    width:100%;padding:5px 0;border-radius:7px;font-size:11px;font-weight:600;cursor:pointer;
    border:1px solid var(--line-strong);background:var(--surface);
    color:var(--ink);transition:background .15s;
  }
  .setbtn:hover{background:var(--surface-2)}
  .setbtn.yes{
    color:var(--accent-ink);background:var(--accent-tint);border-color:var(--accent-tint-2);
  }
  .setbtn.no{
    color:var(--debit);background:var(--red-bg);border-color:var(--red-border);
  }

  /* ── Pagination ── */
  .pager{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
  .pgnums{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
  .pgn{
    min-width:32px;height:32px;
    border:1px solid var(--line);background:transparent;
    border-radius:8px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;
    transition:background .15s,color .15s;
  }
  .pgn:hover{background:var(--surface-2);color:var(--ink)}
  .pgn.on{
    background:var(--accent-tint);border-color:var(--accent-tint-2);color:var(--accent-ink);
  }

  /* ── Toast ── */
  .toast{
    position:fixed;left:50%;transform:translateX(-50%);bottom:88px;z-index:80;
    background:var(--toast-bg);color:var(--toast-ink);
    padding:11px 18px;border-radius:14px;font-size:13px;font-weight:600;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.08),
      var(--shadow-lg);
    max-width:90%;text-align:center;
    animation:toastIn .2s var(--ease-out) both;
  }
  @keyframes toastIn{from{transform:translateX(-50%) translateY(8px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}
  .toast.err{background:var(--debit);color:#fff}

  /* ── Banner ── */
  .banner{
    background:var(--red-bg);color:var(--debit);
    border:1px solid var(--red-border);border-radius:12px;
    padding:10px 14px;font-size:13px;font-weight:600;margin-top:12px;
  }
  .banner.net{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-border)}

  /* ── Login — quiet, centered, content-first ── */
  .login{max-width:360px;margin:0 auto;padding:min(18vh,140px) 24px 48px}
  .login .crest{
    width:56px;height:56px;border-radius:14px;margin:0 auto 20px;
  }
  .login h1{text-align:center;font-size:22px;font-weight:700;letter-spacing:-.02em;margin-bottom:28px}
  .login p.sub{text-align:center;color:var(--muted);margin:5px 0 24px;font-size:14px}
  .login label:first-of-type{margin-top:0}
  .login .btn{margin-top:4px}
  .spin{
    width:18px;height:18px;
    border:2px solid rgba(255,255,255,.35);border-top-color:#fff;
    border-radius:50%;display:inline-block;
    animation:sp .7s linear infinite;vertical-align:-3px;
  }
  @keyframes sp{to{transform:rotate(360deg)}}

  /* ── Live realtime badge ── */
  .livebadge{
    display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:600;
    text-transform:uppercase;letter-spacing:.06em;color:var(--muted-2);
    padding:4px 10px;border-radius:999px;
    border:1px solid var(--line);background:var(--surface-2);
  }
  .livebadge.on{
    color:var(--credit);border-color:var(--green-border);background:var(--green-bg);
  }
  .livedot{width:7px;height:7px;border-radius:50%;background:var(--muted-2);flex:0 0 auto}
  .livebadge.on .livedot{
    background:var(--credit);
    animation:pulse 1.8s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(16,185,129,.45)}
    70%{box-shadow:0 0 0 7px rgba(16,185,129,0)}
    100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}
  }

  /* ── Charts ── */
  .chart-wrap{width:100%;height:210px}
  .recharts-cartesian-axis-tick text{fill:var(--muted)}

  // Bill total — EXACT copy of the billing app's finalTotal():
  //   finalTotal = sum(price*qty) - discountAmt + adjustAmt
  //   discount only if discount_on && discount_pct>0 ; adjustment only if adjustment_on
  function billTotal(c){
    if(!c) return 0;
    let items = c.items;
    if (typeof items === "string"){ try{ items = JSON.parse(items); }catch(e){ items = []; } }
    if (!Array.isArray(items)) items = [];
    const raw  = items.reduce((s,i)=> s + num(i.price)*num(i.qty), 0);
    const disc = (c.discount_on && num(c.discount_pct)>0) ? Math.round(raw*num(c.discount_pct)/100) : 0;
    const adj  = c.adjustment_on ? num(c.adjustment) : 0;
    return raw - disc + adj;
  }
  // Revenue counts ONLY bills the billing app marks settled — same rule as Total Rev.
  const isSettled = (c)=> !!(c && c.status === "settled");
  const custKey = (c)=> (c && (c.phone && String(c.phone).trim())) || ("name:"+String((c&&c.name)||"").trim().toLowerCase());

  }

  /* =====================================================================
     LEDGER MODULE — simple income / expense cashbook
       income  = money IN  (Sales from bills, Investment, Other)  → green +
       expense = money OUT (manual entry: amount, category, note)  → red −
       every entry is auto-stamped with the creator's name.
     ===================================================================== */
  const INCOME_CATS  = ["Sales","Investment","Other income"];
  const EXPENSE_CATS = ["Supplies / Purchase","Salary / Wages","Rent","Utilities","Gas / Fuel","Equipment","Repairs","Marketing","Transport","Misc"];
  const CAT_EMOJI = { "Sales":"🧾","Investment":"💰","Other income":"➕","Supplies / Purchase":"🛒","Salary / Wages":"👤","Rent":"🏠","Utilities":"💡","Gas / Fuel":"🔥","Equipment":"🔧","Repairs":"🛠","Marketing":"📣","Transport":"🚚","Misc":"📦" };

  function monthLabel(m){
    if(!m) return ""; const p=m.split("-");
    const d=new Date(Number(p[0]),Number(p[1])-1,1);
    return d.toLocaleDateString("en-IN",{month:"long",year:"numeric"});
  }

  // Parse a spreadsheet cell into YYYY-MM-DD (handles Excel serials, Date objects, dd/mm/yyyy, ISO).
  function parseDate(v){
    const p2=(n)=>String(n).padStart(2,"0");
    if(v==null||v==="") return "";
    if(v instanceof Date && !isNaN(v)) return v.getFullYear()+"-"+p2(v.getMonth()+1)+"-"+p2(v.getDate());
    if(typeof v==="number"){ const d=new Date(Math.round((v-25569)*86400000)); return isNaN(d)?"":(d.getUTCFullYear()+"-"+p2(d.getUTCMonth()+1)+"-"+p2(d.getUTCDate())); }
    const s=String(v).trim();
    let m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);   // dd/mm/yyyy (Indian convention)
    if(m){ let dd=+m[1],mm=+m[2],yy=+m[3]; if(yy<100) yy+=2000; const d=new Date(yy,mm-1,dd); return isNaN(d)?"":(d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())); }
    const d=new Date(s); return isNaN(d)?"":(d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate()));
  }

  function Ledger({me,online}){
    const meEmail = (me && me.email) || "staff";
    const isAdmin = !!(me && me.role==="admin");
    const [entries,setEntries]=useState([]);
    const [bills,setBills]=useState([]);
    const [users,setUsers]=useState([]);
    const [loading,setLoading]=useState(true);
    const loadedOnce=useRef(false);   // gate the full-screen spinner to the FIRST load only

    // ----- advanced search state -----
    const [mode,setMode]=useState("month");                 // all | month | year | dates
    const [month,setMonth]=useState(localISO(new Date()).slice(0,7));
    const [year,setYear]=useState(String(new Date().getFullYear()));
    const [dFrom,setDFrom]=useState(""); const [dTo,setDTo]=useState("");
    const [staff,setStaff]=useState("all");
    const [catF,setCatF]=useState("all");
    const [kind,setKind]=useState("all");
    const [settleF,setSettleF]=useState("all");   // all | un | yes — settle status filter
    const [q,setQ]=useState("");

    const [sheet,setSheet]=useState(null);
    const [recon,setRecon]=useState(false);
    const [importing,setImporting]=useState(false);
    const [imp,setImp]=useState(false);
    const [showImport,setShowImport]=useState(false);
    const [page,setPage]=useState(0);
    const PAGE_SIZE=10;
    const [xls,setXls]=useState(false);

    const load=useCallback(async()=>{
      // Only show the blocking spinner on first load. Realtime refreshes must NOT
      // flip `loading`, or the early-return below unmounts any open sheet and wipes
      // whatever the user is typing.
      if(!loadedOnce.current) setLoading(true);
      try{
        const [e,c,u]=await Promise.all([
          sb.from("mh_ledger").select("*").order("entry_date",{ascending:false}).order("created_at",{ascending:false}),
          sb.from("mh_customers").select("*"),
          sb.from("mh_users").select("*")
        ]);
        if(e.error) throw e.error;
        setEntries(e.data||[]);
        setBills((c.data||[]).filter(isSettled));
        setUsers((u.data||[]).filter(x=>x.active!==false));
        loadedOnce.current=true;
      }catch(err){ toastErr(err.message||"Load failed"); }
      setLoading(false);
    },[]);
    useEffect(()=>{ load(); },[load]);
    // Live updates: ledger entries + bills (settling a bill changes "sales from bills").
    const live=useRealtime(["mh_ledger","mh_customers"], load);

    const userMap=useMemo(()=>{ const m={}; users.forEach(u=>{ if(u.email) m[u.email]=initCap(u.display_name||u.email.split("@")[0]); }); return m; },[users]);
    const kindOf=(e)=> e.entry_type==="expense"?"expense":"income";
    const dateOf=(e)=> String(e.entry_date||e.created_at||"").slice(0,10);

    const months=useMemo(()=>{ const s=new Set(entries.map(e=>dateOf(e).slice(0,7)).filter(Boolean)); s.add(localISO(new Date()).slice(0,7)); return Array.from(s).sort().reverse(); },[entries]);
    const years=useMemo(()=>{ const s=new Set(entries.map(e=>dateOf(e).slice(0,4)).filter(Boolean)); s.add(String(new Date().getFullYear())); return Array.from(s).sort().reverse(); },[entries]);
    // Who gets credited for an entry. `created_by` records who imported/created
    // it (kept untouched as the audit trail); `settled_by` records who actually
    // collected the payment and is set at settle time. The later one wins, so a
    // bill imported by one staffer and collected by another credits the collector.
    const creditOf=(e)=> (e && (e.settled_by || e.created_by)) || "";
    // staff dropdown = active users + any credited key present in entries not already listed
    const staffOpts=useMemo(()=>{
      const opts=users.map(u=>({ value:u.email, label:initCap(u.display_name||u.email.split("@")[0]) }));
      const known=new Set(opts.map(o=>o.value));
      entries.forEach(e=>{ [e.created_by,e.settled_by].forEach(k=>{ if(k && !known.has(k)){ known.add(k); opts.push({ value:k, label:dispName(k,userMap) }); } }); });
      return opts.sort((a,b)=>a.label.localeCompare(b.label));
    },[users,entries,userMap]);

    const inPeriod=(d)=>{
      if(mode==="all") return true;
      if(mode==="month") return d.slice(0,7)===month;
      if(mode==="year") return d.slice(0,4)===year;
      if(mode==="dates"){ if(dFrom && d<dFrom) return false; if(dTo && d>dTo) return false; return true; }
      return true;
    };
    const matchStaff=(e)=> staff==="all" || creditOf(e)===staff || (staff==="__none" && !creditOf(e));
    const matchCat=(e)=> catF==="all" || (e.category||"")===catF;
    const matchText=(e)=> !q.trim() || (String(e.note||"")+" "+String(e.category||"")).toLowerCase().indexOf(q.trim().toLowerCase())>=0;

    const catOpts=useMemo(()=>{
      const s=new Set(); entries.forEach(e=>{ if(e.category) s.add(e.category); });
      INCOME_CATS.concat(EXPENSE_CATS).forEach(c=>s.add(c));
      return Array.from(s).sort();
    },[entries]);

    const periodEntries=useMemo(()=> entries.filter(e=> inPeriod(dateOf(e)) && matchStaff(e) && matchCat(e) && matchText(e)),[entries,mode,month,year,dFrom,dTo,staff,catF,q]);
    // Settle = money actually received / paid. Entries flagged "No" are pending
    // and must NOT count toward Income / Expense / Net until flipped to "Yes";
    // they are surfaced separately as "pending" so nothing goes invisible.
    const isSettledEntry=(e)=> e.settled!==false;
    // A reversed entry and the reversal posted against it cancel out, but each
    // was still inflating the GROSS Income / Expense tiles by its own amount
    // (a reversed 1000 sale read as income 1000 + expense 1000). Voided money
    // never moved — neither side counts toward any total.
    const isReversal=(e)=> e.source==="reversal";
    const countsEntry=(e)=> !e.reversed && !isReversal(e);
    const sumOf=(list,k)=> list.filter(e=>kindOf(e)===k).reduce((s,e)=>s+num(e.amount),0);
    const countedEntries=useMemo(()=> periodEntries.filter(countsEntry),[periodEntries]);
    const settledEntries=useMemo(()=> countedEntries.filter(isSettledEntry),[countedEntries]);
    const unsettledEntries=useMemo(()=> countedEntries.filter(e=>!isSettledEntry(e)),[countedEntries]);
    const income = useMemo(()=> sumOf(settledEntries,"income"),[settledEntries]);
    const expense= useMemo(()=> sumOf(settledEntries,"expense"),[settledEntries]);
    const net = income-expense;
    const pendingIncome = useMemo(()=> sumOf(unsettledEntries,"income"),[unsettledEntries]);
    const pendingExpense= useMemo(()=> sumOf(unsettledEntries,"expense"),[unsettledEntries]);
    const matchSettle=(e)=> settleF==="all" || (settleF==="un" ? e.settled===false : e.settled!==false);
    const shown=useMemo(()=> periodEntries.filter(e=> (kind==="all"||kindOf(e)===kind) && matchSettle(e)),[periodEntries,kind,settleF]);
    const unsettledCount=unsettledEntries.length;

    // Chart base: entries respecting the staff / category / search filters. The
    // dashboard applies its own date period (week / 15d / month / 6m / year),
    // independent of the page's date mode. Unsettled entries are excluded so the
    // chart agrees with the Income / Expense / Net tiles.
    const chartBase=useMemo(()=> entries.filter(e=> countsEntry(e)&&isSettledEntry(e)&&matchStaff(e)&&matchCat(e)&&matchText(e)),[entries,staff,catF,q]);

    // ----- pagination (10 / page, same pattern as billing history) -----
    const totalPages=Math.max(1,Math.ceil(shown.length/PAGE_SIZE));
    const safePage=Math.min(page,totalPages-1);
    const pageItems=useMemo(()=> shown.slice(safePage*PAGE_SIZE,(safePage+1)*PAGE_SIZE),[shown,safePage]);
    useEffect(()=>{ setPage(0); },[mode,month,year,dFrom,dTo,staff,catF,kind,q,settleF]);
    const pageBtns=useMemo(()=>{
      const out=[]; let lo=Math.max(0,safePage-2), hi=Math.min(totalPages-1,lo+4); lo=Math.max(0,hi-4);
      for(let p=lo;p<=hi;p++) out.push(p); return out;
    },[safePage,totalPages]);

    // ----- detailed export (.xlsx; respects current filters) -----
    function exportData(){
      if(!shown.length){ toast("Nothing to export"); return; }
      const header=["Date","Type","Category","Description","Amount","Mode","Credited to","Created by","Collected by","Imported by","Source","Recorded at","Ref"];
      const aoa=[header]; let inc=0,exp=0;
      shown.forEach(e=>{
        const k=kindOf(e); if(k==="income") inc+=num(e.amount); else exp+=num(e.amount);
        aoa.push([ dateOf(e), k, e.category||"", e.note||"", num(e.amount), e.mode||"",
          creditOf(e)?dispName(creditOf(e),userMap):"unassigned",
          e.created_by?dispName(e.created_by,userMap):"",
          e.settled_by?dispName(e.settled_by,userMap):"",
          e.imported_by?dispName(e.imported_by,userMap):"",
          e.source||"",
          e.created_at?new Date(e.created_at).toLocaleString("en-IN"):"", e.ref||"" ]);
      });
      aoa.push([]); aoa.push(["Income","","","",inc]); aoa.push(["Expense","","","",exp]); aoa.push(["Net","","","",inc-exp]);
      const tag = mode==="all"?"all": mode==="month"?month: mode==="year"?year: ((dFrom||"start")+"_"+(dTo||"now"));
      if(typeof XLSX!=="undefined"){
        const ws=XLSX.utils.aoa_to_sheet(aoa);
        ws["!cols"]=[{wch:12},{wch:9},{wch:16},{wch:32},{wch:11},{wch:8},{wch:16},{wch:16},{wch:16},{wch:16},{wch:9},{wch:20},{wch:10}];
        const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"Ledger");
        XLSX.writeFile(wb,"gavthan-ledger-"+tag+".xlsx");
        toast("Exported "+shown.length+" entries");
      } else {
        const esc=(v)=>{ const s=v==null?"":String(v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
        const blob=new Blob(["\ufeff"+aoa.map(r=>r.map(esc).join(",")).join("\n")],{type:"text/csv;charset=utf-8;"});
        const url=URL.createObjectURL(blob); const a=document.createElement("a");
        a.href=url; a.download="gavthan-ledger-"+tag+".csv"; document.body.appendChild(a); a.click();
        setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },120);
        toast("Excel library unavailable — exported CSV");
      }
    }

    const periodLabel = mode==="all"?"all time": mode==="month"?monthLabel(month): mode==="year"?year: (dFrom||dTo)?((dFrom?fmtDate(dFrom):"start")+" – "+(dTo?fmtDate(dTo):"now")):"selected dates";

    // ----- sales reconciliation -----
    const importedRefs=useMemo(()=>{ const s=new Set(); entries.forEach(e=>{ if(e.source==="bill"&&e.ref!=null) s.add(String(e.ref)); }); return s; },[entries]);
    // How much is actually STANDING in the cashbook per bill. A reversed row is
    // voided money — it must not count as imported, or deleting/voiding a bill
    // leaves "On record" and "Imported" permanently apart (the bill drops out of
    // mh_customers so live falls, while the reversed row kept inflating imported).
    const importedByRef=useMemo(()=>{ const m={}; entries.forEach(e=>{ if(e.source==="bill"&&e.ref!=null&&!e.reversed){ const k=String(e.ref); m[k]=(m[k]||0)+num(e.amount); } }); return m; },[entries]);
    const billRowCount=useMemo(()=>{ const m={}; entries.forEach(e=>{ if(e.source==="bill"&&e.ref!=null&&!e.reversed){ const k=String(e.ref); m[k]=(m[k]||0)+1; } }); return m; },[entries]);
    // Bills whose imported entry has been reversed — the sale was voided in the
    // cashbook. Never offer to re-sync these; syncing would resurrect the money.
    const voidedRefs=useMemo(()=>{ const s=new Set(); entries.forEach(e=>{ if(e.source==="bill"&&e.ref!=null&&e.reversed) s.add(String(e.ref)); }); return s; },[entries]);

    // Re-point an imported bill's ledger row at the bill's current total.
    async function syncBill(b){
      const k=String(b.id);
      if(voidedRefs.has(k)){ toastErr("Voided in the cashbook — re-import instead"); return; }
      if((billRowCount[k]||0)!==1){ toastErr("Imported "+(billRowCount[k]||0)+"× — fix manually"); return; }
      const row=entries.find(e=> e.source==="bill" && String(e.ref)===k && !e.reversed);
      if(!row) return;
      const { error } = await sb.from("mh_ledger").update({ amount:b.amount }).eq("id",row.id);
      if(error){ toastErr(error.message||"Sync failed"); return; }
      toast("Synced to "+money(b.amount)); await load();
    }
    const billRows=useMemo(()=> bills.map(c=>({ id:c.id, bill_no:c.bill_no, name:c.name, added_by:c.added_by,
      date:(function(t){return t?new Date(t).toLocaleDateString('en-CA',{timeZone:'Asia/Kolkata'}):"";})(c.settled_at||c.date||c.bill_time||c.created_at), amount:billTotal(c) })),[bills]);
    const liveSales=useMemo(()=> billRows.reduce((s,b)=>s+b.amount,0),[billRows]);
    const importedSales=useMemo(()=> entries.filter(e=>e.source==="bill"&&!e.reversed).reduce((s,e)=>s+num(e.amount),0),[entries]);
    // Bill-sourced rows whose bill is no longer a settled bill on record — the bill
    // was deleted or un-settled after import. Invisible in the list below (which
    // iterates bills, not ledger rows), so surface them explicitly.
    const billIdSet=useMemo(()=> new Set(billRows.map(b=>String(b.id))),[billRows]);
    const orphanRows=useMemo(()=> entries.filter(e=> e.source==="bill" && e.ref!=null && !billIdSet.has(String(e.ref)))
      .map(e=>({ id:e.id, ref:String(e.ref), amount:num(e.amount), note:e.note||"", date:dateOf(e), reversed:!!e.reversed })),[entries,billIdSet]);
    const pending=useMemo(()=> billRows.filter(b=> !importedRefs.has(String(b.id))),[billRows,importedRefs]);
    const zeroBills=useMemo(()=> billRows.filter(b=> b.amount<=0).length,[billRows]);

    // assignTo: null = fall back to the bill's own staff, "" = deliberately
    // unassigned (credited later, when the payment is received), else an email.
    async function importSales(assignTo,subset){
      const list = (subset && subset.length) ? subset : pending;
      if(!list.length){ toast("No new bills to import"); return; }
      const unassigned = assignTo==="";
      const rows=list.map(b=>({
        entry_type:"income", amount:b.amount, category:"Sales", mode:"bill",
        ref:String(b.id), note:"Bill "+(b.bill_no?("#"+b.bill_no):"(no number)"),
        entry_date:b.date||todayISO(), source:"bill",
        // who the sale is credited to at import time (may be nobody)
        created_by: unassigned ? null : (assignTo || b.added_by || meEmail),
        // who actually ran the import — audit metadata, never used for crediting
        imported_by: meEmail }));
      const { error } = await sb.from("mh_ledger").insert(rows);
      if(error) throw error;
      toast("Imported "+rows.length+" sale"+(rows.length>1?"s":""));
      await load();
      return rows.length;
    }

    // Settling IS the payment-receipt moment, so that is where the credited staff
    // is captured. `who` lands in settled_by; created_by (the import record) is
    // never overwritten. Un-settling clears settled_by — the payment didn't stand.
    async function setSettle(id,val,who){
      const patch = val ? { settled:true, settled_by: who || null } : { settled:false, settled_by:null };
      const prevRow = entries.find(x=>x.id===id);
      setEntries(prev=> prev.map(x=> x.id===id?{...x,...patch}:x));   // optimistic
      const { error } = await sb.from("mh_ledger").update(patch).eq("id",id);
      if(error){
        toastErr(error.message||"Couldn't update");
        setEntries(prev=> prev.map(x=> x.id===id?(prevRow||{...x,settled:!val}):x));
      }
    }

    // Re-point an already-settled entry at a different collector, without
    // touching its settled state or its import attribution.
    async function reassignCredit(id,who){
      const prevRow = entries.find(x=>x.id===id);
      setEntries(prev=> prev.map(x=> x.id===id?{...x,settled_by:who||null}:x));
      const { error } = await sb.from("mh_ledger").update({ settled_by: who||null }).eq("id",id);
      if(error){ toastErr(error.message||"Couldn't reassign"); setEntries(prev=> prev.map(x=> x.id===id?(prevRow||x):x)); return; }
      toast(who?("Credited to "+dispName(who,userMap)):"Credit cleared");
    }

    // Tapping "No" opens this so the collector can be named as the money lands.
    const [settleFor,setSettleFor]=useState(null);
    const [settleWho,setSettleWho]=useState("");
    const [settleBusy,setSettleBusy]=useState(false);
    function openSettle(e){
      setSettleFor(e);
      setSettleWho(isAdmin ? (creditOf(e)||meEmail) : meEmail);
    }
    async function confirmSettle(){
      if(!settleFor) return;
      setSettleBusy(true);
      await setSettle(settleFor.id, true, settleWho||null);
      setSettleBusy(false); setSettleFor(null);
    }

    const [detail,setDetail]=useState(null);   // ledger row tapped -> view/reverse sheet
    const [reversing,setReversing]=useState(false);
    // No delete on ledger rows (audit trail). Void an entry by posting an
    // identical opposing entry instead, and flag the original so it can't be
    // reversed twice. The reversal itself is not reversible.
    async function reverseEntry(e){
      setReversing(true);
      try{
        const oppKind = kindOf(e)==="income" ? "expense" : "income";
        const { error:e1 } = await sb.from("mh_ledger").insert({
          entry_type:oppKind, amount:num(e.amount), category:e.category||"Reversal",
          note:"Reversal of: "+(e.note||e.category||"entry"), entry_date:todayISO(),
          mode:e.mode||null, source:"reversal", ref:String(e.id), created_by:meEmail });
        if(e1) throw e1;
        const { error:e2 } = await sb.from("mh_ledger").update({ reversed:true }).eq("id",e.id);
        if(e2) throw e2;
        toast("Entry reversed"); setDetail(null); await load();
      }catch(err){ toastErr(err.message||"Reversal failed"); }
      setReversing(false);
    }

    /* ---- partial settlement ----
       Customer paid part of a settled income entry (usually an imported bill).
       Split the shortfall WITHOUT touching the original: an unsettled income
       row for the balance still owed (excluded from totals, surfaces as
       "pending"), plus a settled expense row of the same amount so the Dr/Cr
       columns stay balanced. Net therefore falls to the cash actually taken. */
    const [partial,setPartial]=useState(null);   // entry being split
    const [partialAmt,setPartialAmt]=useState("");
    const [partialBusy,setPartialBusy]=useState(false);
    const isPartialRow=(e)=> e.source==="partial";
    const canPartial=(e)=> kindOf(e)==="income" && isSettledEntry(e)
      && !e.reversed && !isReversal(e) && !isPartialRow(e) && !e.partially_settled;

    async function savePartial(){
      const e=partial; if(!e) return;
      const paid=num(partialAmt), total=num(e.amount);
      if(!(paid>0 && paid<total)) return;
      const remaining=Math.round((total-paid)*100)/100;
      if(remaining<=0) return;
      setPartialBusy(true);
      try{
        // Both rows carry the ORIGINAL entry's date, never today's — else
        // splitting an older bill scatters the pair into the current period
        // while the bill stays in the past, leaving Dr/Cr visibly unbalanced
        // under a month / date-range filter.
        const when=dateOf(e)||todayISO();
        const label=e.note||e.category||"entry";
        const { error:e1 } = await sb.from("mh_ledger").insert({
          entry_type:"income", amount:remaining, category:e.category||"Partial",
          note:"Outstanding: "+label, entry_date:when, mode:e.mode||null,
          source:"partial", ref:String(e.id), created_by:meEmail, settled:false });
        if(e1) throw e1;
        const { error:e2 } = await sb.from("mh_ledger").insert({
          entry_type:"expense", amount:remaining, category:e.category||"Partial",
          note:"Balancing entry for outstanding: "+label, entry_date:when, mode:null,
          source:"partial", ref:String(e.id), created_by:meEmail });
        if(e2) throw e2;
        const { error:e3 } = await sb.from("mh_ledger").update({ partially_settled:true }).eq("id",e.id);
        if(e3) throw e3;
        toast("Partial payment recorded");
        setPartial(null); setPartialAmt(""); setDetail(null); await load();
      }catch(err){ toastErr(err.message||"Couldn't record payment"); }
      setPartialBusy(false);
    }

    if(loading) return html`<div class="wrap"><div class="empty"><span class="spin" style=${{borderColor:'var(--line-strong)',borderTopColor:'var(--accent)'}}></span><div style=${{marginTop:10}}>Loading cashbook…</div></div></div>`;

    return html`<div class="wrap">
      <${LedgerDash} entries=${chartBase} live=${live}/>
      <div class="card" style=${{marginTop:12}}><div class="pad">
        <div class="seg" style=${{marginBottom:10}}>
          ${[["all","All"],["month","Month"],["year","Year"],["dates","Dates"]].map(o=>
            html`<button key=${o[0]} class=${mode===o[0]?"on":""} onClick=${()=>setMode(o[0])}>${o[1]}</button>`)}
        </div>
        ${mode==="month" && html`<select value=${month} onChange=${e=>setMonth(e.target.value)}>
          ${months.map(m=> html`<option key=${m} value=${m}>${monthLabel(m)}</option>`)}</select>`}
        ${mode==="year" && html`<select value=${year} onChange=${e=>setYear(e.target.value)}>
          ${years.map(y=> html`<option key=${y} value=${y}>${y}</option>`)}</select>`}
        ${mode==="dates" && html`<div class="row" style=${{gap:8}}>
          <input type="date" value=${dFrom} onChange=${e=>setDFrom(e.target.value)}/>
          <span class="muted tiny">to</span>
          <input type="date" value=${dTo} onChange=${e=>setDTo(e.target.value)}/></div>`}
        <label>Staff</label>
        <select value=${staff} onChange=${e=>setStaff(e.target.value)}>
          <option value="all">All staff</option>
          <option value="__none">Unassigned</option>
          ${staffOpts.map(o=> html`<option key=${o.value} value=${o.value}>${o.label}</option>`)}
        </select>
        <label>Category</label>
        <select value=${catF} onChange=${e=>setCatF(e.target.value)}>
          <option value="all">All categories</option>
          ${catOpts.map(c=> html`<option key=${c} value=${c}>${(CAT_EMOJI[c]||"")+" "+c}</option>`)}
        </select>
        <div class="search" style=${{marginTop:10}}><span class="ic"><${Icon} name="search" size=${16}/></span>
          <input placeholder="Search description / category" value=${q} onChange=${e=>setQ(e.target.value)}/></div>
      </div></div>

      <div class="stats">
        <div class="stat green"><div class="k">Income</div><div class="v">${money(income)}</div>
          ${pendingIncome>0 && html`<div class="pend">+${money(pendingIncome)} pending</div>`}</div>
        <div class="stat red"><div class="k">Expense</div><div class="v">${money(expense)}</div>
          ${pendingExpense>0 && html`<div class="pend">+${money(pendingExpense)} pending</div>`}</div>
      </div>
      <div class="stat" style=${{marginTop:10}}>
        <div class="k">Net · ${periodLabel}${staff!=="all"?(" · "+(staff==="__none"?"unassigned":dispName(staff,userMap))):""}${catF!=="all"?(" · "+catF):""}</div>
        <div class="v" style=${{color: net>=0?'var(--credit)':'var(--debit)'}}>${money(net)}</div>
        ${unsettledCount>0 && html`<div class="pend">Settled only · ${unsettledCount} unsettled entr${unsettledCount===1?"y":"ies"} excluded</div>`}
      </div>

      ${(pending.length>0 || liveSales!==importedSales) && html`<div class="card"><div class="pad">
        <div class="between">
          <div><b>Sales from bills</b>
            <div class="tiny muted">On record ${money(liveSales)} · imported ${money(importedSales)}</div></div>
          ${pending.length>0 && html`<button class="btn sm" disabled=${!online} onClick=${()=>setImp(true)}>Import ${pending.length}</button>`}
        </div>
        ${(liveSales!==importedSales || zeroBills>0) && html`<button class="btn ghost sm" style=${{width:'100%',marginTop:10}} onClick=${()=>setRecon(true)}><${Icon} name="reconcile"/>Reconcile ${billRows.length} bills${zeroBills?(" · "+zeroBills+" show ₹0"):""}</button>`}
      </div></div>`}

      ${isAdmin && html`<button class="btn ghost sm" style=${{width:'100%',marginTop:12}} onClick=${()=>setShowImport(v=>!v)}><${Icon} name=${showImport?"chevronDown":"chevronRight"}/>${showImport?"Hide Excel import":"Import from Excel"}</button>`}
      ${isAdmin && showImport && html`<div class="card" style=${{marginTop:8}}><div class="pad between">
        <div><b>Import from Excel</b><div class="tiny muted">Admin · Date · Description · User · Dr · Cr</div></div>
        <button class="btn sec sm" onClick=${()=>setXls(true)}><${Icon} name="upload" size=${16}/>Upload</button>
      </div></div>`}

      <div class="seg" style=${{marginTop:12}}>
        <button class=${kind==="all"?"on":""} onClick=${()=>setKind("all")}>All</button>
        <button class=${kind==="income"?"on":""} onClick=${()=>setKind("income")}>Income</button>
        <button class=${kind==="expense"?"on":""} onClick=${()=>setKind("expense")}>Expense</button>
      </div>

      <div class="card" style=${{marginTop:12}}>
        <div class="hd">
          <h3 style=${{fontSize:14}}>${shown.length} entr${shown.length===1?"y":"ies"}${shown.length>PAGE_SIZE?(" · page "+(safePage+1)+"/"+totalPages):""}</h3>
          <div class="row" style=${{gap:6}}>
            <button class=${"btn ghost sm settlebtn"+(settleF==="un"?" un":settleF==="yes"?" yes":"")}
              aria-pressed=${settleF!=="all"}
              title="Filter by settle status"
              onClick=${()=>setSettleF(f=> f==="all"?"un":f==="un"?"yes":"all")}>
              <${Icon} name="check" size=${15}/>${settleF==="un"?("Unsettled"+(unsettledCount?" · "+unsettledCount:"")):settleF==="yes"?"Settled":"Settle: All"}
            </button>
            ${shown.length>0 && html`<button class="btn ghost sm" onClick=${exportData} title="Download as Excel (.xlsx)"><${Icon} name="download" size=${16}/>Export</button>`}
          </div>
        </div>
        ${shown.length===0? html`<div class="empty"><${Icon} name="inbox"/>No entries match this filter</div>`
        : html`<div>
            <div class="lthead">
              <span>Date</span><span>Description</span><span>Dr</span><span>Cr</span><span>Settle</span>
            </div>
            ${pageItems.map(e=>{ const isInc=kindOf(e)==="income"; const p=dateOf(e).split("-");
              const dmy=p.length===3?(p[2]+"/"+p[1]+"/"+p[0].slice(2)):dateOf(e);
              // The generated balancing expense of a partial split is locked: it
              // still counts fully toward Expense (so it is NOT dimmed like a
              // voided row), but toggling it would desync it from its pair.
              const isBalancing = isPartialRow(e) && kindOf(e)==="expense";
              return html`<div class=${"ltrow"+(e.reversed||isReversal(e)?" ltrow-void":"")} key=${e.id} aria-label=${"View entry: "+(e.note||e.category||"entry")} ...${clickable(()=>setDetail(e))}>
                <span class="lt-date">${dmy}</span>
                <span class="lt-desc">
                  <b class="ell">${e.note|| (isInc?"Income":"Expense")}</b>
                  <div class="sub ell">${(CAT_EMOJI[e.category]||"")+" "+(e.category||"—")} · ${creditOf(e)?dispName(creditOf(e),userMap):"unassigned"}${e.settled_by&&e.created_by&&e.settled_by!==e.created_by?" ⇄":""}${e.source==="bill"?" · auto":""}${e.reversed?" · reversed":""}${isReversal(e)?" · reversal":""}${isPartialRow(e)?(isInc?" · outstanding":" · balancing · locked"):""}${e.partially_settled?" · part paid":""}</div>
                </span>
                <span class="lt-amt lt-dr">${isInc?numFmt(e.amount):""}</span>
                <span class="lt-amt lt-cr">${isInc?"":numFmt(e.amount)}</span>
                <span class="lt-setcell"><button class=${"setbtn "+(e.settled===false?"no":"yes")} disabled=${isBalancing}
                  title=${isBalancing?"Generated balancing entry — locked":(e.settled===false?"Record payment received":"Mark unpaid")}
                  onClick=${(ev)=>{ev.stopPropagation(); if(isBalancing) return; if(e.settled===false) openSettle(e); else setSettle(e.id,false);}}>${e.settled===false?"No":"Yes"}</button></span>
              </div>`; })}
          </div>`}
        ${shown.length>PAGE_SIZE && html`<div class="pager">
          <button class="btn ghost sm" disabled=${safePage===0} onClick=${()=>setPage(Math.max(0,safePage-1))}>← Prev</button>
          <div class="pgnums">
            ${pageBtns.map(p=> html`<button key=${p} class=${"pgn"+(p===safePage?" on":"")} onClick=${()=>setPage(p)}>${p+1}</button>`)}
          </div>
          <button class="btn ghost sm" disabled=${safePage>=totalPages-1} onClick=${()=>setPage(Math.min(totalPages-1,safePage+1))}>Next →</button>
        </div>`}
      </div>
    </div>

    <div class="fab"><button class="btn" onClick=${()=>setSheet({kind:"expense"})}><${Icon} name="plus"/>Add income / expense</button></div>

    ${sheet && html`<${EntrySheet} kind0=${sheet.kind} meEmail=${meEmail} isAdmin=${isAdmin}
        users=${users} userMap=${userMap} onClose=${()=>setSheet(null)} onSaved=${()=>{setSheet(null);load();}}/>`}
    ${detail && html`<${Sheet} onClose=${()=>setDetail(null)} title="Entry detail">
        <div class="banner" style=${{background:'var(--surface-2)',color:'var(--ink)',borderColor:'var(--line-strong)'}}>
          <b>${detail.note||detail.category||"Entry"}</b><br/>
          <span class="tiny muted">${(CAT_EMOJI[detail.category]||"")+" "+(detail.category||"—")} · ${dateOf(detail)}</span>
        </div>
        <label>Credited to${detail.settled===false?" (set when payment is received)":""}</label>
        ${isAdmin
          ? html`<select value=${creditOf(detail)||""} onChange=${ev=>{ const v=ev.target.value; setDetail(d=>({...d,settled_by:v||null})); reassignCredit(detail.id, v||null); }}>
              <option value="">— unassigned —</option>
              ${staffOpts.map(o=> html`<option key=${o.value} value=${o.value}>${o.label}</option>`)}
            </select>`
          : html`<div class="banner" style=${{background:'var(--surface-2)',color:'var(--ink)',borderColor:'var(--line-strong)',fontWeight:500}}>
              ${creditOf(detail)?dispName(creditOf(detail),userMap):"Unassigned"} <span class="tiny">(only an admin can reassign)</span></div>`}
        <div class="tiny muted" style=${{margin:"6px 2px 0"}}>
          Imported / created by <b style=${{color:'var(--ink)'}}>${detail.created_by?dispName(detail.created_by,userMap):"—"}</b>${detail.settled_by?(" · payment collected by "+dispName(detail.settled_by,userMap)):""}
        </div>
        <div class="stats" style=${{marginTop:12}}>
          <div class=${"stat "+(kindOf(detail)==="income"?"green":"red")}>
            <div class="k">${kindOf(detail)==="income"?"Income":"Expense"}</div>
            <div class="v">${money(detail.amount)}</div>
          </div>
        </div>
        ${isPartialRow(detail) && html`<div class="banner net" style=${{marginTop:12}}>${kindOf(detail)==="income"
          ? "Outstanding balance from a partial payment (of #"+detail.ref+"). Settle it when the rest is received."
          : "Balancing entry for a partial payment (of #"+detail.ref+"). Generated automatically and locked — it offsets the outstanding amount."}</div>`}
        ${detail.partially_settled && html`<div class="banner net" style=${{marginTop:12}}>A partial payment has already been recorded against this entry.</div>`}
        ${detail.reversed
          ? html`<div class="banner net" style=${{marginTop:12}}>This entry has already been reversed. No further action needed.</div>`
          : isReversal(detail)
          ? html`<div class="banner net" style=${{marginTop:12}}>This is itself a reversal entry (of #${detail.ref}) — it can't be reversed again.</div>`
          : html`<div>
              ${canPartial(detail) && html`<div>
                <p class="tiny muted" style=${{margin:"12px 2px"}}>Customer paid only part of this? Record what was received — the shortfall stays on the books as an unsettled (pending) amount instead of counting as income.</p>
                <button class="btn sec" onClick=${()=>{ setPartial(detail); setPartialAmt(""); }}>Partial payment</button>
              </div>`}
              <p class="tiny muted" style=${{margin:"12px 2px"}}>No delete — voiding this entry posts an equal, opposite ${kindOf(detail)==="income"?"expense":"income"} entry dated today, and marks the original as reversed. Both stay in the ledger for audit.</p>
              <button class="btn danger" disabled=${reversing} onClick=${()=>{ if(confirm("Reverse this entry? This posts an opposing "+money(detail.amount)+" entry and cannot be undone.")) reverseEntry(detail); }}>${reversing?"Reversing…":"Reversal entry"}</button>
            </div>`}
    </${Sheet}>`}
    ${settleFor && html`<${Sheet} onClose=${()=>setSettleFor(null)} title="Payment received">
        <div class="banner" style=${{background:'var(--surface-2)',color:'var(--ink)',borderColor:'var(--line-strong)'}}>
          <b>${settleFor.note||settleFor.category||"Entry"}</b><br/>
          <span class="tiny muted">${money(settleFor.amount)} · ${dateOf(settleFor)}${settleFor.created_by?(" · imported by "+dispName(settleFor.created_by,userMap)):""}</span>
        </div>
        <label>Credited to</label>
        ${isAdmin
          ? html`<select value=${settleWho} onChange=${ev=>setSettleWho(ev.target.value)}>
              <option value="">— leave unassigned —</option>
              ${staffOpts.map(o=> html`<option key=${o.value} value=${o.value}>${o.label}</option>`)}
            </select>`
          : html`<div class="banner" style=${{background:'var(--surface-2)',color:'var(--ink)',borderColor:'var(--line-strong)',fontWeight:500}}>
              ${dispName(meEmail,userMap)} <span class="tiny">(an admin can credit someone else)</span></div>`}
        <p class="tiny muted" style=${{margin:"8px 2px 0"}}>Whoever actually collected this money. The import record stays as it is — this only sets who is credited for the receipt.</p>
        <div class="sheet-foot">
          <button class="btn" disabled=${settleBusy} onClick=${confirmSettle}>${settleBusy?"Saving…":"Mark received"}</button>
        </div>
      </${Sheet}>`}
    ${partial && html`<${Sheet} onClose=${()=>{setPartial(null);setPartialAmt("");}} title="Partial payment">
        <div class="banner" style=${{background:'var(--surface-2)',color:'var(--ink)',borderColor:'var(--line-strong)'}}>
          <b>${partial.note||partial.category||"Entry"}</b><br/>
          <span class="tiny muted">Billed ${money(partial.amount)} · ${dateOf(partial)}</span>
        </div>
        <label>Amount received</label>
        <input value=${partialAmt} onChange=${ev=>setPartialAmt(ev.target.value)} inputMode="decimal" autoFocus placeholder="0"/>
        ${(()=>{ const paid=num(partialAmt), total=num(partial.amount);
          if(!partialAmt.trim()) return null;
          if(!(paid>0)) return html`<div class="banner" style=${{marginTop:12}}>Enter an amount greater than 0.</div>`;
          if(paid>=total) return html`<div class="banner" style=${{marginTop:12}}>That's the full amount or more — use the Settle toggle instead.</div>`;
          const rem=Math.round((total-paid)*100)/100;
          return html`<div class="banner net" style=${{marginTop:12}}>${money(rem)} stays outstanding. An unsettled income entry for it will be added, plus a matching expense so debits and credits balance.</div>`;
        })()}
        <div class="sheet-foot">
          <button class="btn" disabled=${partialBusy||!(num(partialAmt)>0&&num(partialAmt)<num(partial.amount))} onClick=${savePartial}>${partialBusy?"Saving…":"Record payment"}</button>
        </div>
      </${Sheet}>`}
    ${recon && html`<${ReconSheet} rows=${billRows} importedRefs=${importedRefs} importedByRef=${importedByRef}
        billRowCount=${billRowCount} voidedRefs=${voidedRefs} orphanRows=${orphanRows}
        live=${liveSales} imported=${importedSales}
        onSync=${syncBill} onClose=${()=>setRecon(false)}/>`}
    ${xls && html`<${ExcelImportSheet} users=${users} userMap=${userMap} meEmail=${meEmail}
        onClose=${()=>setXls(false)} onSaved=${()=>{setXls(false);load();}}/>`}
    ${imp && html`<${ImportSalesSheet} count=${pending.length} total=${pending.reduce((s,b)=>s+b.amount,0)}
        bills=${pending} isAdmin=${isAdmin} users=${users} userMap=${userMap} meEmail=${meEmail}
        onClose=${()=>setImp(false)} onConfirm=${importSales} onDone=${()=>setImp(false)}/>`}
    `;
  }

  function EntrySheet({kind0,meEmail,isAdmin,users,userMap,onClose,onSaved}){
    const [kind,setKind]=useState(kind0||"expense");
    const cats = kind==="income"?INCOME_CATS:EXPENSE_CATS;
    const [amt,setAmt]=useState(""); const [cat,setCat]=useState(cats[0]);
    const [desc,setDesc]=useState(""); const [date,setDate]=useState(todayISO());
    const [mode,setMode]=useState("cash"); const [target,setTarget]=useState(meEmail);
    const [busy,setBusy]=useState(false);
    function switchKind(k){ setKind(k); setCat((k==="income"?INCOME_CATS:EXPENSE_CATS)[0]); }
    async function save(){
      const a=num(amt); if(a<=0) return; setBusy(true);
      try{
        const creator = isAdmin ? (target||meEmail) : meEmail;
        const { error } = await sb.from("mh_ledger").insert({
          entry_type:kind, amount:a, category:cat, note:desc.trim()||cat,
          entry_date:date, mode: kind==="income"?mode:null, source:"manual", created_by:creator });
        if(error) throw error;
        toast(kind==="income"?"Income added":"Expense added"); onSaved();
      }catch(err){ toastErr(err.message||"Save failed"); setBusy(false); }
    }
    return html`<${Sheet} onClose=${onClose} title="New entry">
      <div class=${"seg"+(kind==="expense"?" alt":"")}>
        <button class=${kind==="income"?"on":""} onClick=${()=>switchKind("income")}>Income</button>
        <button class=${kind==="expense"?"on":""} onClick=${()=>switchKind("expense")}>Expense</button>
      </div>
      <label>Amount</label>
      <input value=${amt} onChange=${e=>setAmt(e.target.value)} inputMode="decimal" autoFocus placeholder="0"/>
      <label>Category</label>
      <select value=${cat} onChange=${e=>setCat(e.target.value)}>
        ${cats.map(c=> html`<option key=${c} value=${c}>${(CAT_EMOJI[c]||"")+" "+c}</option>`)}
      </select>
      <label>Date</label>
      <input type="date" value=${date} onChange=${e=>setDate(e.target.value)}/>
      <label>Description</label>
      <input value=${desc} onChange=${e=>setDesc(e.target.value)} placeholder=${kind==="income"?"e.g. owner investment":"e.g. vegetables from market"}/>
      ${kind==="income" && html`<div><label>Received via</label>
        <select value=${mode} onChange=${e=>setMode(e.target.value)}>
          <option value="cash">Cash</option><option value="upi">UPI</option><option value="card">Card</option><option value="bank">Bank transfer</option>
        </select></div>`}
      ${isAdmin
        ? html`<div><label>Recorded by (admin)</label>
            <select value=${target} onChange=${e=>setTarget(e.target.value)}>
              ${users.map(u=> html`<option key=${u.email} value=${u.email}>${initCap(u.display_name||u.email.split("@")[0])}${u.email===meEmail?" (you)":""}</option>`)}
            </select>
            <p class="tiny muted" style=${{marginTop:6}}>As admin you can log this entry on behalf of another staff member.</p></div>`
        : html`<div class="banner" style=${{background:'var(--surface-2)',color:'var(--muted)',borderColor:'var(--line-strong)',fontWeight:500}}>
            Recorded by <b style=${{color:'var(--ink)'}}>${dispName(meEmail,userMap)}</b></div>`}
      <div class="sheet-foot">
        <button class="btn" disabled=${busy||num(amt)<=0} onClick=${save}>${busy?"Saving…":"Save "+kind}</button>
      </div>
    </${Sheet}>`;
  }

  /* ---- Confirm/attribute sales import ---- */
  function ImportSalesSheet({count,total,bills,isAdmin,users,userMap,meEmail,onClose,onConfirm,onDone}){
    const [tab,setTab]=useState("bulk");             // "bulk" | "one"
    const [assign,setAssign]=useState("original");   // "original" | <email>
    const [perAssign,setPerAssign]=useState({});     // bill.id -> "original" | <email>
    const [busy,setBusy]=useState(false);
    const [busyId,setBusyId]=useState(null);
    // "original" -> null (fall back to the bill's own staff), "none" -> "" (an
    // explicit unassigned import; the collector is credited at payment time).
    const pick=(v)=> v==="original" ? null : v==="none" ? "" : v;
    async function go(){
      setBusy(true);
      try{ await onConfirm(pick(assign)); onDone&&onDone(); }
      catch(e){ toastErr(e.message||"Import failed"); setBusy(false); }
    }
    async function goOne(b){
      setBusyId(b.id);
      try{ await onConfirm(pick(perAssign[b.id]||"original"), [b]); }
      catch(e){ toastErr(e.message||"Import failed"); }
      setBusyId(null);
    }
    return html`<${Sheet} onClose=${onClose} title="Import sales from bills">
      <div class="stats" style=${{marginTop:4}}>
        <div class="stat"><div class="k">New bills</div><div class="v">${count}</div></div>
        <div class="stat green"><div class="k">Total</div><div class="v">${money(total)}</div></div>
      </div>
      <div class="seg" style=${{marginTop:12}}>
        <button class=${tab==="bulk"?"on":""} onClick=${()=>setTab("bulk")}>Import once</button>
        <button class=${tab==="one"?"on":""} onClick=${()=>setTab("one")}>One by one</button>
      </div>
      ${tab==="bulk"
        ? html`<div>
      <label>Attribute these sales to</label>
      ${isAdmin
        ? html`<div>
            <select value=${assign} onChange=${e=>setAssign(e.target.value)}>
              <option value="original">Each bill's original staff</option>
              <option value="none">Leave unassigned \u2014 decide when paid</option>
              ${users.map(u=> html`<option key=${u.email} value=${u.email}>${initCap(u.display_name||u.email.split("@")[0])}${u.email===meEmail?" (you)":""}</option>`)}
            </select>
            <p class="tiny muted" style=${{marginTop:6}}>${assign==="none"
              ? "Imported with no one credited. Whoever collects the payment gets credited when the entry is marked received."
              : "Attribution isn't final \u2014 whoever collects the payment can be credited at that point instead."}</p>
          </div>`
        : html`<div class="banner" style=${{background:'var(--surface-2)',color:'var(--muted)',borderColor:'var(--line-strong)',fontWeight:500}}>
            Credited to each bill's original staff. ${'\u00A0'}<span class="tiny">(Can be re-credited when the payment is received.)</span></div>`}
      <div class="sheet-foot">
        <button class="btn" disabled=${busy||count===0} onClick=${go}>${busy?html`<span class="spin"></span> Importing…`:("Import "+count+" sale"+(count===1?"":"s"))}</button>
      </div>
          </div>`
        : html`<div>
            <p class="tiny muted" style=${{margin:"10px 2px"}}>Import each bill on its own${isAdmin?", choosing who it's credited to":""}. ${count} pending.</p>
            ${count===0
              ? html`<div class="empty"><${Icon} name="check"/>All bills imported</div>`
              : (bills||[]).map(b=> html`<div class="entry" key=${b.id}>
                  <div class="grow">
                    <div><b>${b.bill_no?("#"+b.bill_no):"(no number)"}</b> <span class="tiny muted">${b.name||""}</span></div>
                    <div class="tiny muted">${fmtDate(b.date)} · ${money(b.amount)}</div>
                    ${isAdmin && html`<select style=${{marginTop:6}} value=${perAssign[b.id]||"original"} onChange=${e=>setPerAssign(p=>({...p,[b.id]:e.target.value}))}>
                        <option value="original">Original staff${b.added_by?(" ("+dispName(b.added_by,userMap)+")"):""}</option>
                        <option value="none">Unassigned — decide when paid</option>
                        ${users.map(u=> html`<option key=${u.email} value=${u.email}>${initCap(u.display_name||u.email.split("@")[0])}${u.email===meEmail?" (you)":""}</option>`)}
                      </select>`}
                  </div>
                  <button class="btn sm" disabled=${busyId!=null} onClick=${()=>goOne(b)}>${busyId===b.id?html`<span class="spin"></span>`:"Import"}</button>
                </div>`)}
          </div>`}
    </${Sheet}>`;
  }

  function ReconSheet({rows,importedRefs,importedByRef,billRowCount,voidedRefs,orphanRows,live,imported,onSync,onClose}){
    const [busyId,setBusyId]=useState(null);
    const stateOf=(b)=>{
      const k=String(b.id);
      if(voidedRefs.has(k)) return { tag:"voided in cashbook", voided:true, drift:0, dupes:0 };
      if(!importedRefs.has(k)) return { tag:"not imported", drift:0, dupes:0 };
      const posted=num(importedByRef[k]||0), dupes=billRowCount[k]||0;
      const drift=Math.round((b.amount-posted)*100)/100;
      return { tag:"imported", posted, drift, dupes };
    };
    const sorted=[...rows].sort((a,b)=> (Number(a.bill_no)||0)-(Number(b.bill_no)||0));
    const drifted=sorted.filter(b=> stateOf(b).drift!==0 && importedRefs.has(String(b.id)));
    const totalDrift=drifted.reduce((s,b)=> s+stateOf(b).drift,0);
    async function sync(b){ setBusyId(b.id); await onSync(b); setBusyId(null); }
    return html`<${Sheet} onClose=${onClose} title="Sales reconciliation">
      <div class="stats" style=${{marginTop:4}}>
        <div class="stat"><div class="k">On record</div><div class="v">${money(live)}</div></div>
        <div class="stat"><div class="k">Imported</div><div class="v">${money(imported)}</div></div>
      </div>
      ${drifted.length>0 && html`<div class="banner" style=${{marginTop:12}}>
        ${drifted.length} bill${drifted.length===1?"":"s"} changed after import — the cashbook still holds the old figure
        (${money(Math.abs(totalDrift))} out). Tap Sync on a row to post the bill's current total.
      </div>`}
      ${orphanRows.length>0 && html`<div>
        <div class="tiny muted" style=${{margin:"14px 2px 6px",fontWeight:700,textTransform:"uppercase",letterSpacing:".05em"}}>No longer on record</div>
        <div class="tiny muted" style=${{margin:"0 2px 8px"}}>Imported from a bill that has since been deleted or un-settled. Reversed ones are already voided and need nothing.</div>
        ${orphanRows.map(o=> html`<div class="entry" key=${o.id}>
          <span class=${"dot "+(o.reversed?"c":"d")}></span>
          <div class="grow">
            <div><b class="ell">${o.note||"(bill entry)"}</b></div>
            <div class="tiny muted">${fmtDate(o.date)} · ${o.reversed?"reversed — already voided":"still counted — reverse it to void"}</div>
          </div>
          <div class="amt" style=${{color:o.reversed?'var(--muted)':'var(--debit)'}}>${money(o.amount)}</div>
        </div>`)}
      </div>`}
      <div class="tiny muted" style=${{margin:"14px 2px 6px",fontWeight:700,textTransform:"uppercase",letterSpacing:".05em"}}>${rows.length} settled bills (oldest first)</div>
      ${sorted.map(b=>{ const st=stateOf(b); const bad=b.amount<=0;
        return html`<div class="entry" key=${b.id} style=${st.voided?{opacity:.55}:null}>
        <span class=${"dot "+(bad||st.drift!==0?"d":"c")}></span>
        <div class="grow">
          <div><b>${b.bill_no?("#"+b.bill_no):"(no number)"}</b> <span class="tiny muted">${b.name||""}</span></div>
          <div class="tiny muted">${fmtDate(b.date)} · ${st.tag}${st.dupes>1?(" ×"+st.dupes):""}${st.drift!==0?(" · cashbook has "+money(st.posted)):""}${bad?" · total reads ₹0":""}</div>
        </div>
        <div style=${{textAlign:"right"}}>
          <div class="amt" style=${{color:bad?'var(--debit)':'var(--ink)'}}>${money(b.amount)}</div>
          ${st.drift!==0 && st.dupes===1 && html`<button class="btn sec sm" style=${{marginTop:4}} disabled=${busyId!=null} onClick=${()=>sync(b)}>${busyId===b.id?"…":"Sync"}</button>`}
          ${st.drift!==0 && st.dupes>1 && html`<div class="tiny" style=${{color:'var(--debit)',marginTop:4}}>imported ${st.dupes}×</div>`}
        </div>
      </div>`; })}
    </${Sheet}>`;
  }

  /* ---- Admin: import a ledger spreadsheet (Date / Description / User / Dr / Cr) ---- */
  function ExcelImportSheet({users,userMap,meEmail,onClose,onSaved}){
    const [step,setStep]=useState("pick");          // pick | preview
    const [fileName,setFileName]=useState("");
    const [rows,setRows]=useState([]);
    const [mapping,setMapping]=useState("dr_income"); // dr_income: Dr=income,Cr=expense  | cr_income: swapped
    const [incCat,setIncCat]=useState("Other income");
    const [expCat,setExpCat]=useState("Misc");
    const [err,setErr]=useState(""); const [busy,setBusy]=useState(false);

    const nameToEmail=useMemo(()=>{ const m={}; users.forEach(u=>{ if(u.display_name) m[String(u.display_name).toLowerCase().trim()]=u.email; if(u.email) m[String(u.email).toLowerCase().trim()]=u.email; }); return m; },[users]);
    const resolveUser=(s)=>{ if(!s) return ""; const k=String(s).toLowerCase().trim(); return nameToEmail[k]||String(s).trim(); };

    async function onFile(ev){
      const f=ev.target.files && ev.target.files[0]; if(!f) return;
      setErr("");
      if(typeof XLSX==="undefined"){ setErr("Excel library didn't load. Check your connection and reload the page."); return; }
      setFileName(f.name);
      try{
        const buf=await f.arrayBuffer();
        const wb=XLSX.read(buf,{type:"array"});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,blankrows:false});
        if(!aoa.length){ setErr("That sheet looks empty."); return; }
        // locate the header row
        let hi=0;
        for(let i=0;i<Math.min(6,aoa.length);i++){
          const r=(aoa[i]||[]).map(x=>String(x).toLowerCase());
          if(r.some(c=>/date/.test(c)) && r.some(c=>/dr|debit|cr|credit|amount/.test(c))){ hi=i; break; }
        }
        const hdr=(aoa[hi]||[]).map(x=>String(x).toLowerCase().trim());
        const find=(re)=> hdr.findIndex(c=>re.test(c));
        const ci={ date:find(/date|dt/), desc:find(/desc|particular|narration|detail|note|remark/),
          user:find(/account|user|staff|\bby\b|name|cashier|emp/), cat:find(/categ|head|group/),
          dr:find(/^dr$|debit/), cr:find(/^cr$|credit/), amt:find(/amount|amt/) };
        if(ci.dr<0 && ci.cr<0 && ci.amt<0){ setErr("Couldn't find a Dr/Cr or Amount column. Headers seen: "+hdr.filter(Boolean).join(", ")); return; }
        const out=[];
        for(let i=hi+1;i<aoa.length;i++){
          const row=aoa[i]||[];
          const date=parseDate(ci.date>=0?row[ci.date]:"");
          const desc=ci.desc>=0?String(row[ci.desc]==null?"":row[ci.desc]).trim():"";
          const user=ci.user>=0?String(row[ci.user]==null?"":row[ci.user]).trim():"";
          const cat=ci.cat>=0?String(row[ci.cat]==null?"":row[ci.cat]).trim():"";
          let dr=ci.dr>=0?num(row[ci.dr]):0, cr=ci.cr>=0?num(row[ci.cr]):0;
          if(ci.dr<0 && ci.cr<0 && ci.amt>=0) dr=num(row[ci.amt]);
          if(!date && !desc && !dr && !cr) continue;
          out.push({date,desc,user,cat,dr,cr});
        }
        if(!out.length){ setErr("No data rows found below the header."); return; }
        setRows(out); setStep("preview");
      }catch(e){ setErr("Couldn't read the file: "+(e.message||e)); }
    }

    const drIsIncome = mapping==="dr_income";
    const totals=useMemo(()=>{
      let inc=0,exp=0,skip=0;
      rows.forEach(r=>{
        if(r.dr>0)(drIsIncome?inc+=r.dr:exp+=r.dr);
        if(r.cr>0)(drIsIncome?exp+=r.cr:inc+=r.cr);
        if(r.dr<=0&&r.cr<=0) skip++;
      });
      return {inc,exp,skip,net:inc-exp};
    },[rows,drIsIncome]);

    function buildEntries(){
      const list=[];
      rows.forEach(r=>{
        const d=r.date||todayISO(); const creator=resolveUser(r.user)||meEmail;
        const mk=(kind,amt)=>({ entry_type:kind, amount:amt, category: r.cat || (kind==="income"?incCat:expCat),
          note:r.desc||r.cat||(kind==="income"?incCat:expCat), entry_date:d, mode:null, source:"excel", created_by:creator });
        if(r.dr>0) list.push(mk(drIsIncome?"income":"expense", r.dr));
        if(r.cr>0) list.push(mk(drIsIncome?"expense":"income", r.cr));
      });
      return list;
    }

    async function confirm(){
      const list=buildEntries();
      if(!list.length){ setErr("No valid amounts to import."); return; }
      setBusy(true); setErr("");
      try{
        for(let i=0;i<list.length;i+=200){
          const { error } = await sb.from("mh_ledger").insert(list.slice(i,i+200));
          if(error) throw error;
        }
        toast("Imported "+list.length+" entries"); onSaved();
      }catch(e){ setErr(e.message||"Import failed"); setBusy(false); }
    }

    return html`<${Sheet} onClose=${onClose} title="Import ledger from Excel">
      ${err && html`<div class="banner">${err}</div>`}
      ${step==="pick" ? html`<div>
        <p class="tiny muted" style=${{margin:"4px 2px 12px"}}>Upload an .xlsx / .xls / .csv file. The first sheet should have a header row including <b>Date</b>, <b>Description</b>, <b>User</b>, and <b>Dr</b> / <b>Cr</b> (or a single Amount) columns. Column order doesn't matter.</p>
        <label>Spreadsheet file</label>
        <input type="file" accept=".xlsx,.xls,.csv" onChange=${onFile}/>
        ${typeof XLSX==="undefined" && html`<div class="banner net" style=${{marginTop:12}}>Excel library still loading — if this persists, reload the page.</div>`}
      </div>` : html`<div>
        <div class="between" style=${{margin:"2px 2px 8px"}}>
          <div class="tiny muted row" style=${{gap:6}}><${Icon} name="file" size=${14}/>${fileName} · ${rows.length} rows</div>
          <button class="btn ghost sm" onClick=${()=>{setStep("pick");setRows([]);setFileName("");}}>Change file</button>
        </div>
        <label>Column mapping</label>
        <div class="seg">
          <button class=${drIsIncome?"on":""} onClick=${()=>setMapping("dr_income")}>Dr = Income</button>
          <button class=${!drIsIncome?"on":""} onClick=${()=>setMapping("cr_income")}>Cr = Income</button>
        </div>
        <div class="row" style=${{gap:10}}>
          <div class="grow"><label>Default income category</label>
            <select value=${incCat} onChange=${e=>setIncCat(e.target.value)}>${INCOME_CATS.map(c=>html`<option key=${c} value=${c}>${c}</option>`)}</select></div>
          <div class="grow"><label>Default expense category</label>
            <select value=${expCat} onChange=${e=>setExpCat(e.target.value)}>${EXPENSE_CATS.map(c=>html`<option key=${c} value=${c}>${c}</option>`)}</select></div>
        </div>
        <p class="tiny muted" style=${{margin:"6px 2px 0"}}>Each row uses its own <b>Category</b> column when present; the defaults above fill in only where a row has none. Entries are attributed to the row's <b>Account</b> / user.</p>
        <div class="stats" style=${{marginTop:12}}>
          <div class="stat green"><div class="k">Income</div><div class="v">${money(totals.inc)}</div></div>
          <div class="stat red"><div class="k">Expense</div><div class="v">${money(totals.exp)}</div></div>
        </div>
        <div class="tiny muted" style=${{margin:"12px 2px 4px"}}>Preview (first 8 of ${rows.length})${totals.skip?(" · "+totals.skip+" rows have no amount and will be skipped"):""}</div>
        ${rows.slice(0,8).map((r,i)=> html`<div class="entry" key=${i}>
          <div class="grow"><div class="ell"><b>${r.desc||"—"}</b></div>
            <div class="tiny muted ell">${fmtDate(r.date)||"(no date)"} · ${dispName(resolveUser(r.user),userMap)||"unattributed"}${r.cat?html` · <span class="pill">${r.cat}</span>`:""}</div></div>
          <div style=${{textAlign:"right"}}>
            ${r.dr>0 && html`<div class="amt ${drIsIncome?"c":"d"}">Dr ${money(r.dr)}</div>`}
            ${r.cr>0 && html`<div class="amt ${drIsIncome?"d":"c"}">Cr ${money(r.cr)}</div>`}
          </div>
        </div>`)}
        <div class="banner net" style=${{marginTop:12}}>Re-running an import adds new rows. To redo, an admin can clear prior Excel imports in Supabase: <code>delete from mh_ledger where source='excel';</code></div>
        <div class="sheet-foot">
          <button class="btn" disabled=${busy} onClick=${confirm}>${busy?"Importing…":"Import "+buildEntries().length+" entries"}</button>
        </div>
      </div>`}
    </${Sheet}>`;
  }

  /* =====================================================================
     INVENTORY MODULE
     ===================================================================== */
  function Inventory({me,online}){
    const [items,setItems]=useState([]);
    const [moves,setMoves]=useState([]);
    const [loading,setLoading]=useState(true);
    const [q,setQ]=useState(""); const [filter,setFilter]=useState("all"); // all | low
    const [edit,setEdit]=useState(null);   // item or {} for new
    const [moveFor,setMoveFor]=useState(null);
    const [history,setHistory]=useState(null);
    const [mvPage,setMvPage]=useState(0);
    const MOVES_PAGE_SIZE=10;
    const MOVES_CHUNK=300;
    // How many moves to fetch. Grows by a chunk whenever the pager reaches the
    // end of what's loaded. Kept as the fetch limit (rather than appending to
    // `moves`) so a realtime refresh re-reads the same window instead of
