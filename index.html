    // silently throwing away the older pages the user already paged into.
    const [mvLimit,setMvLimit]=useState(MOVES_CHUNK);
    const [sync,setSync]=useState(false);
    const [syncCounts,setSyncCounts]=useState({pending:0,unmapped:0});
    const loadedOnce=useRef(false);   // gate the full-screen spinner to the FIRST load only
    const isAdmin = !!(me && me.role==="admin");

    const load=useCallback(async()=>{
      // First load shows the spinner; realtime refreshes must not, or an open
      // ItemSheet/MoveSheet unmounts and the user loses what they were typing.
      if(!loadedOnce.current) setLoading(true);
      try{
        const [i,m]=await Promise.all([
          sb.from("mh_inventory_items").select("*").order("name"),
          sb.from("mh_stock_moves").select("*").order("created_at",{ascending:false}).limit(mvLimit)
        ]);
        if(i.error) throw i.error;
        setItems((i.data||[]).filter(x=>x.active!==false));
        setMoves(m.data||[]);
        loadedOnce.current=true;
      }catch(err){ toastErr(err.message||"Load failed"); }
      setLoading(false);
    },[mvLimit]);

    // Bill-sync backlog counts for the Stock sync card. Kept separate from the
    // main load so a missing migration only blanks this card, never the screen.
    const loadSyncCounts=useCallback(async()=>{
      try{
        const [p,u]=await Promise.all([
          sb.from("mh_stock_sync_pending").select("bill_id",{count:"exact",head:true}),
          sb.from("mh_stock_sync_log").select("id",{count:"exact",head:true}).eq("status","unmapped")
        ]);
        setSyncCounts({pending:p.count||0, unmapped:u.count||0});
      }catch(err){ /* migration not applied yet — leave counts at zero */ }
    },[]);
    useEffect(()=>{ if(isAdmin) loadSyncCounts(); },[isAdmin,loadSyncCounts]);
    useEffect(()=>{ load(); },[load]);
    // Live updates: stock items + stock moves pushed from the server refresh instantly.
    const live=useRealtime(["mh_inventory_items","mh_stock_moves"], load);

    const isLow=(it)=> num(it.reorder_level)>0 && num(it.qty)<=num(it.reorder_level);
    const totalValue=useMemo(()=> items.reduce((s,it)=> s+num(it.qty)*num(it.cost_price),0),[items]);
    const lowCount=useMemo(()=> items.filter(isLow).length,[items]);

    // Dashboard datasets — recomputed whenever live data arrives.
    const levels=useMemo(()=> items
      .map(it=>({ name:it.name||"(item)", qty:num(it.qty), low:isLow(it) }))
      .sort((a,b)=> b.qty-a.qty).slice(0,8),[items]);

    const list=useMemo(()=>{
      const s=q.trim().toLowerCase();
      return items
        .filter(it=> filter==="all" || isLow(it))
        .filter(it=> !s || (it.name||"").toLowerCase().includes(s) || (it.category||"").toLowerCase().includes(s))
        .sort((a,b)=> (isLow(b)-isLow(a)) || (a.name||"").localeCompare(b.name||""));
    },[items,q,filter]);

    // ----- stock-move pagination (10 / page, same pattern as the ledger) -----
    const mvTotalPages=Math.max(1,Math.ceil(moves.length/MOVES_PAGE_SIZE));
    const mvSafePage=Math.min(mvPage,mvTotalPages-1);
    const mvPageItems=useMemo(()=> moves.slice(mvSafePage*MOVES_PAGE_SIZE,(mvSafePage+1)*MOVES_PAGE_SIZE),[moves,mvSafePage]);
    const mvPageBtns=useMemo(()=>{
      const out=[]; let lo=Math.max(0,mvSafePage-2), hi=Math.min(mvTotalPages-1,lo+4); lo=Math.max(0,hi-4);
      for(let p=lo;p<=hi;p++) out.push(p); return out;
    },[mvSafePage,mvTotalPages]);
    // A full result set means the server probably has older rows still unread.
    const mvHasMore = moves.length>=mvLimit;
    const mvFetchingOlder = mvHasMore && mvSafePage>=mvTotalPages-1;
    // Landing on the last page pulls the next chunk. Once it arrives the list
    // grows, so this page is no longer the last and the effect stops firing.
    useEffect(()=>{ if(mvFetchingOlder) setMvLimit(l=> l+MOVES_CHUNK); },[mvFetchingOlder]);

    // ----- stock-move export (.xlsx, CSV fallback; exports everything loaded) -----
    function exportMoves(){
      if(!moves.length){ toast("Nothing to export"); return; }
      const label={ in:"Purchase / in", out:"Used / out", waste:"Wastage", adjust:"Adjustment" };
      const header=["Date","Item","Category","Movement","Qty","Unit","Unit cost","Value","Note","By","Recorded at"];
      const aoa=[header];
      moves.forEach(mv=>{
        const it=items.find(x=>x.id===mv.item_id);
        const qty=num(mv.qty), cost=num(mv.unit_cost);
        aoa.push([ String(mv.move_date||mv.created_at||"").slice(0,10), it?it.name:"(item)", (it&&it.category)||"",
          label[mv.move_type]||mv.move_type||"", qty, (it&&it.unit)||"",
          cost||"", cost?Math.round(qty*cost*100)/100:"", mv.note||"", mv.created_by||"",
          mv.created_at?new Date(mv.created_at).toLocaleString("en-IN"):"" ]);
      });
      const tag=localISO(new Date());
      if(typeof XLSX!=="undefined"){
        const ws=XLSX.utils.aoa_to_sheet(aoa);
        ws["!cols"]=[{wch:12},{wch:24},{wch:14},{wch:15},{wch:9},{wch:7},{wch:10},{wch:11},{wch:28},{wch:22},{wch:20}];
        const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"Stock moves");
        XLSX.writeFile(wb,"gavthan-stock-moves-"+tag+".xlsx");
        toast("Exported "+moves.length+" movement"+(moves.length===1?"":"s"));
      } else {
        const esc=(v)=>{ const s=v==null?"":String(v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
        const blob=new Blob(["﻿"+aoa.map(r=>r.map(esc).join(",")).join("\n")],{type:"text/csv;charset=utf-8;"});
        const url=URL.createObjectURL(blob); const a=document.createElement("a");
        a.href=url; a.download="gavthan-stock-moves-"+tag+".csv"; document.body.appendChild(a); a.click();
        setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },120);
        toast("Excel library unavailable — exported CSV");
      }
    }

    if(loading) return html`<div class="wrap"><div class="empty"><span class="spin" style=${{borderColor:'var(--line-strong)',borderTopColor:'var(--accent)'}}></span><div style=${{marginTop:10}}>Loading stock…</div></div></div>`;

    return html`<div class="wrap">
      <${InventoryDash} levels=${levels} moves=${moves} live=${live}/>
      <div class="stats">
        <div class="stat"><div class="k">Stock value</div><div class="v">${money(totalValue)}</div></div>
        <div class=${"stat"+(lowCount?" warn":"")}><div class="k">Low / out</div><div class="v">${lowCount}</div></div>
      </div>

      <div class="seg" style=${{marginTop:12}}>
        <button class=${filter==="all"?"on":""} onClick=${()=>setFilter("all")}>All items (${items.length})</button>
        <button class=${filter==="low"?"on":""} onClick=${()=>setFilter("low")}>Low stock (${lowCount})</button>
      </div>
      <div class="search"><span class="ic"><${Icon} name="search" size=${16}/></span>
        <input placeholder="Search items / category" value=${q} onChange=${e=>setQ(e.target.value)}/></div>

      <div class="card" style=${{marginTop:12}}>
        ${list.length===0 ? html`<div class="empty"><${Icon} name="package"/>${items.length?"Nothing matches.":"No items yet. Add your first stock item."}</div>`
        : list.map(it=> html`<div class="lrow" key=${it.id} aria-label=${"Record movement for "+it.name} ...${clickable(()=>setMoveFor(it))}>
            <div class="grow">
              <div class="row" style=${{gap:7}}><b class="ell">${it.name}</b>
                ${isLow(it)? html`<span class="pill low">low</span>`: html`<span class="pill ok">ok</span>`}</div>
              <div class="tiny muted ell">${it.category?it.category+" · ":""}${it.cost_price?money(it.cost_price)+"/"+(it.unit||"unit"):""}${num(it.reorder_level)>0?" · reorder @ "+num(it.reorder_level):""}</div>
            </div>
            <div style=${{textAlign:"right"}}>
              <div class="amt" style=${{color:isLow(it)?'var(--debit)':'var(--ink)'}}>${num(it.qty)}</div>
              <div class="tiny muted">${it.unit||"units"}</div>
            </div>
            <button class="btn ghost sm" aria-label=${"Edit "+it.name} style=${{width:44,height:44,padding:0,display:"grid",placeItems:"center"}} onClick=${(e)=>{e.stopPropagation();setEdit(it);}}><${Icon} name="pencil" size=${16}/></button>
          </div>`)}
      </div>

      ${isAdmin && html`<div class="card" style=${{marginTop:12}}><div class="hd"><h3>Stock sync</h3>
        <button class="btn ghost sm" onClick=${()=>{setSync(true);}}>Open</button></div>
        <div class="pad" style=${{paddingTop:0}}>
          <div class="tiny muted">Bills settled in the billing app deduct stock automatically. Anything that couldn't be applied waits here.</div>
          <div class="row" style=${{gap:8,marginTop:8}}>
            <span class=${"pill"+(syncCounts.pending?" low":" ok")}>${syncCounts.pending} bill${syncCounts.pending===1?"":"s"} not synced</span>
            <span class=${"pill"+(syncCounts.unmapped?" low":" ok")}>${syncCounts.unmapped} line${syncCounts.unmapped===1?"":"s"} unmapped</span>
          </div>
        </div>
      </div>`}

      <div class="card"><div class="hd">
        <h3>Stock moves${moves.length>MOVES_PAGE_SIZE?(" · page "+(mvSafePage+1)+"/"+mvTotalPages):""}</h3>
        <div class="row" style=${{gap:6}}>
          ${moves.length>0 && html`<button class="btn ghost sm" onClick=${exportMoves} title="Download as Excel (.xlsx)"><${Icon} name="download" size=${16}/>Export</button>`}
          <button class="btn ghost sm" onClick=${()=>setHistory(true)}>View all</button>
        </div></div>
        ${mvPageItems.map(mv=> html`<${MoveRow} key=${mv.id} mv=${mv} items=${items}/>`)}
        ${moves.length===0 && html`<div class="empty"><${Icon} name="folder"/>No movements recorded</div>`}
        ${moves.length>MOVES_PAGE_SIZE && html`<div class="pager">
          <button class="btn ghost sm" disabled=${mvSafePage===0} onClick=${()=>setMvPage(Math.max(0,mvSafePage-1))}>← Prev</button>
          <div class="pgnums">
            ${mvPageBtns.map(p=> html`<button key=${p} class=${"pgn"+(p===mvSafePage?" on":"")} onClick=${()=>setMvPage(p)}>${p+1}</button>`)}
          </div>
          <button class="btn ghost sm" disabled=${mvSafePage>=mvTotalPages-1 && !mvHasMore} onClick=${()=>setMvPage(Math.min(mvTotalPages-1,mvSafePage+1))}>Next →</button>
        </div>`}
        ${mvFetchingOlder && html`<div class="tiny muted" style=${{textAlign:"center",padding:"0 14px 12px"}}>
          <span class="spin" style=${{borderColor:'var(--line-strong)',borderTopColor:'var(--accent)',width:12,height:12}}></span> Loading older moves…
        </div>`}
      </div>
    </div>

    <div class="fab"><button class="btn" onClick=${()=>setEdit({})}><${Icon} name="plus"/>New item</button></div>

    ${edit && html`<${ItemSheet} item=${edit} me=${me}
        onClose=${()=>setEdit(null)} onSaved=${()=>{setEdit(null);load();}}/>`}
    ${moveFor && html`<${MoveSheet} item=${moveFor} me=${me}
        onClose=${()=>setMoveFor(null)} onSaved=${()=>{setMoveFor(null);load();}}/>`}
    ${history && html`<${Sheet} onClose=${()=>setHistory(false)} title="Stock movement history">
        ${moves.length===0? html`<div class="empty">No movements</div>`
          : moves.map(mv=> html`<${MoveRow} key=${mv.id} mv=${mv} items=${items}/>`)}
      </${Sheet}>`}
    ${sync && html`<${StockSyncSheet} items=${items} me=${me}
        onClose=${()=>setSync(false)} onChanged=${()=>{load();loadSyncCounts();}}/>`}
    `;
  }

  const MOVE_META={ in:["+","c","Purchase / in"], out:["−","d","Used / out"], waste:["−","d","Wastage"], adjust:["±","","Adjustment"] };
  function MoveRow({mv,items}){
    const it=items.find(x=>x.id===mv.item_id);
    const meta=MOVE_META[mv.move_type]||["","",mv.move_type];
    return html`<div class="entry" style=${{padding:"11px 14px"}}>
      <span class=${"dot "+(meta[1]||"c")} style=${{background: meta[1]==="d"?"var(--debit)":meta[1]==="c"?"var(--credit)":"var(--muted)"}}></span>
      <div class="grow">
        <div><b>${it?it.name:"(item)"}</b> <span class="tiny muted">— ${meta[2]}</span></div>
        <div class="tiny muted">${fmtDT(mv.created_at||mv.move_date)}${mv.note?" · "+mv.note:""}${mv.created_by?" · "+mv.created_by:""}</div>
      </div>
      <div class="amt" style=${{color: meta[1]==="d"?"var(--debit)":meta[1]==="c"?"var(--credit)":"var(--ink)"}}>${meta[0]}${num(mv.qty)} ${it?it.unit||"":""}</div>
    </div>`;
  }

  function ItemSheet({item,me,onClose,onSaved}){
    const isNew=!item.id;
    const [f,setF]=useState({
      name:item.name||"", category:item.category||"", unit:item.unit||"kg",
      qty:item.qty!=null?String(item.qty):"0", reorder_level:item.reorder_level!=null?String(item.reorder_level):"0",
      cost_price:item.cost_price!=null?String(item.cost_price):"" });
    const [busy,setBusy]=useState(false);
    const set=(k)=>(e)=> setF(o=>({...o,[k]:e.target.value}));
    async function save(){
      if(!f.name.trim()) return;
      setBusy(true);
      try{
        const row={ name:f.name.trim(), category:f.category.trim()||null, unit:f.unit.trim()||"unit",
          reorder_level:num(f.reorder_level), cost_price:num(f.cost_price)||0,
          updated_at:new Date().toISOString() };
        if(isNew){
          row.qty=num(f.qty); row.created_by=me&&me.email; row.active=true;
          const { error } = await sb.from("mh_inventory_items").insert(row); if(error) throw error;
        } else {
          // editing does NOT silently change stock count — use a stock move for that
          const { error } = await sb.from("mh_inventory_items").update(row).eq("id",item.id); if(error) throw error;
        }
        toast(isNew?"Item added":"Item updated"); onSaved();
      }catch(err){ toastErr(err.message||"Save failed"); setBusy(false); }
    }
    async function archive(){
      if(!confirm("Archive “"+item.name+"”? It will be hidden but its history is kept.")) return;
      setBusy(true);
      try{ const { error } = await sb.from("mh_inventory_items").update({active:false}).eq("id",item.id); if(error) throw error;
        toast("Archived"); onSaved(); }
      catch(err){ toastErr(err.message); setBusy(false); }
    }
    return html`<${Sheet} onClose=${onClose} title=${isNew?"New item":"Edit item"}>
      <label>Name</label><input value=${f.name} onChange=${set("name")} autoFocus/>
      <div class="row" style=${{gap:10}}>
        <div class="grow"><label>Category</label><input value=${f.category} onChange=${set("category")} placeholder="Grocery, Veg…"/></div>
        <div style=${{width:110}}><label>Unit</label><input value=${f.unit} onChange=${set("unit")} placeholder="kg / L / pcs"/></div>
      </div>
      ${isNew && html`<div><label>Opening stock</label><input value=${f.qty} onChange=${set("qty")} inputMode="decimal"/></div>`}
      <div class="row" style=${{gap:10}}>
        <div class="grow"><label>Reorder level</label><input value=${f.reorder_level} onChange=${set("reorder_level")} inputMode="decimal"/></div>
        <div class="grow"><label>Cost / ${f.unit||"unit"}</label><input value=${f.cost_price} onChange=${set("cost_price")} inputMode="decimal" placeholder="0"/></div>
      </div>
      ${!isNew && html`<p class="tiny muted" style=${{marginTop:10}}>To change the stock count, tap the item and record a movement instead — that keeps an audit trail.</p>`}
      <div style=${{height:14}}></div>
      <button class="btn" disabled=${busy||!f.name.trim()} onClick=${save}>${busy?"Saving…":isNew?"Add item":"Save changes"}</button>
      ${!isNew && html`<button class="btn danger sm" style=${{width:"100%",marginTop:10}} disabled=${busy} onClick=${archive}>Archive item</button>`}
    </${Sheet}>`;
  }

  function MoveSheet({item,me,onClose,onSaved}){
    const [type,setType]=useState("in");
    const [qty,setQty]=useState(""); const [cost,setCost]=useState(item.cost_price?String(item.cost_price):"");
    const [note,setNote]=useState(""); const [date,setDate]=useState(todayISO());
    const [busy,setBusy]=useState(false);
    const cur=num(item.qty);
    const q=num(qty);
    const projected = type==="in"? cur+q : type==="adjust"? q : cur-q;

    async function save(){
      if(type!=="adjust" && q<=0){ return; }
      setBusy(true);
      try{
        const delta = type==="in"? q : type==="adjust"? (q-cur) : -q;
        // record the movement
        const { error:e1 } = await sb.from("mh_stock_moves").insert({
          item_id:item.id, move_type:type, qty: type==="adjust"? Math.abs(delta) : q,
          unit_cost: type==="in"? (num(cost)||null) : null,
          note: note.trim() || null, move_date:date, created_by:me&&me.email });
        if(e1) throw e1;
        // update item stock (+ latest cost on purchase)
        const upd={ qty: Math.round(projected*1000)/1000, updated_at:new Date().toISOString() };
        if(type==="in" && num(cost)>0) upd.cost_price=num(cost);
        const { error:e2 } = await sb.from("mh_inventory_items").update(upd).eq("id",item.id);
        if(e2) throw e2;
        toast("Stock updated"); onSaved();
      }catch(err){ toastErr(err.message||"Save failed"); setBusy(false); }
    }

    return html`<${Sheet} onClose=${onClose} title=${item.name}>
      <div class="between" style=${{margin:"2px 2px 6px"}}>
        <span class="tiny muted">${item.category||""}</span>
        <span class="tiny muted">Current: <b style=${{color:'var(--ink)'}}>${cur} ${item.unit||""}</b></span>
      </div>
      <label>Movement</label>
      <div class="seg ${type==='out'||type==='waste'?'alt':''}">
        ${[["in","Purchase"],["out","Used"],["waste","Waste"],["adjust","Set to"]].map(o=>
          html`<button key=${o[0]} class=${type===o[0]?"on":""} onClick=${()=>setType(o[0])}>${o[1]}</button>`)}
      </div>
      <label>${type==="adjust"?"New counted stock":"Quantity"} (${item.unit||"unit"})</label>
      <input value=${qty} onChange=${e=>setQty(e.target.value)} inputMode="decimal" autoFocus placeholder="0"/>
      ${type==="in" && html`<div>
        <label>Cost / ${item.unit||"unit"} (optional, updates item cost)</label>
        <input value=${cost} onChange=${e=>setCost(e.target.value)} inputMode="decimal" placeholder="0"/>
      </div>`}
      <label>Date</label><input type="date" value=${date} onChange=${e=>setDate(e.target.value)}/>
      <label>Note (optional)</label><input value=${note} onChange=${e=>setNote(e.target.value)} placeholder="invoice no, reason…"/>
      <div class="banner" style=${{background:'var(--surface-2)',color:'var(--ink)',borderColor:'var(--line-strong)'}}>
        New stock: <b>${isNaN(projected)?cur:Math.round(projected*1000)/1000} ${item.unit||""}</b>
      </div>
      <div style=${{height:14}}></div>
      <button class="btn" disabled=${busy||(type!=="adjust"&&q<=0)} onClick=${save}>${busy?"Saving…":"Record movement"}</button>
    </${Sheet}>`;
  }

  /* ---------- generic bottom sheet ---------- */
  /* ---- Admin: bill → stock sync (pending bills, item mapping, armed categories) ----
     Every corrective action for the cross-app sync lives here so none of it
     needs SQL. Deduction is only ever triggered by an explicit button: opening
     this sheet reads, it never writes. ---- */
  // Fallback only — used when mh_categories can't be read (missing table / RLS).
  // The real list is fetched from mh_categories; nothing here is authoritative.
  const SYNC_CATS_FALLBACK=["starter","cold drinks","water bottle","cigarette"];
  // Must match the DB's mh_norm(): lowercase, trim, collapse inner whitespace.
  const normName=(s)=> String(s==null?"":s).toLowerCase().trim().replace(/\s+/g," ");
  // mh_categories is NOT a row-per-category table: it is (id text, list jsonb),
  // i.e. the billing app keeps the whole category list inside one JSON column.
  // Flatten it, tolerating array-of-strings, array-of-objects and object-map.
  const CAT_LABEL_KEYS=["name","category_name","category","title","label","cat_name","display_name"];
  function catsFromRows(rows){
    const out=[];
    const takeName=(v)=>{
      if(typeof v==="string") return v;
      if(v && typeof v==="object"){ for(const k of CAT_LABEL_KEYS){ if(typeof v[k]==="string" && v[k].trim()) return v[k]; } }
      return "";
    };
    (rows||[]).forEach(r=>{
      let l = r && r.list;
      if(typeof l==="string"){ try{ l=JSON.parse(l); }catch(e){ l=null; } }
      if(Array.isArray(l)) l.forEach(v=> out.push(takeName(v)));
      else if(l && typeof l==="object") Object.keys(l).forEach(k=>{
        // object map: either {"Starter":true} or {"Starter":{...}}
        out.push(takeName(l[k]) || k);
      });
    });
    return out.map(s=>String(s||"").trim()).filter(Boolean);
  }
  const normCat=(s)=> String(s||"").toLowerCase().trim().replace(/\s+/g," ");

  function StockSyncSheet({items,me,onClose,onChanged}){
    const [tab,setTab]=useState("pending");        // pending | mapping | cats
    const [loading,setLoading]=useState(true);
    const [busy,setBusy]=useState("");
    const [pending,setPending]=useState([]);
    const [unmapped,setUnmapped]=useState([]);
    const [maps,setMaps]=useState([]);
    const [cats,setCats]=useState([]);
    const [allCats,setAllCats]=useState([]);       // every category from mh_categories
    const [catErr,setCatErr]=useState("");         // why mh_categories couldn't be read
    const [seenCats,setSeenCats]=useState([]);     // categories observed on real bills
    const [billLines,setBillLines]=useState({});   // bill id -> [{name,category}]
    const [menuRows,setMenuRows]=useState([]);     // {name, category} seen on settled bills
    const [draft,setDraft]=useState({});           // menu_name -> {item_id, ratio}
    const [manual,setManual]=useState({menu:"",item_id:"",ratio:"1"});
    const [err,setErr]=useState("");

    const load=useCallback(async()=>{
      try{
        const [p,u,m,c]=await Promise.all([
          sb.from("mh_stock_sync_pending").select("*").order("bill_date",{ascending:false}).limit(200),
          sb.from("mh_stock_sync_log").select("*").eq("status","unmapped").order("created_at",{ascending:false}),
          sb.from("mh_item_map").select("*").order("menu_name"),
          sb.from("mh_stock_categories").select("*")
        ]);
        if(p.error) throw p.error;
        setPending(p.data||[]); setUnmapped(u.data||[]); setMaps(m.data||[]); setCats(c.data||[]);
        setErr("");

        // Category list comes from the billing app's own table — never hardcoded.
        // Keep the real error: "missing table" and "RLS denied" need different
        // fixes, and swallowing it leaves nothing to diagnose.
        const cc=await sb.from("mh_categories").select("*");
        if(!cc.error && cc.data){ setAllCats(cc.data); setCatErr(""); }
        else { setAllCats([]); setCatErr((cc.error&&cc.error.message)||"unknown error"); }

        // Menu names for the pairing picker, and each line's category. There is
        // no menu table in this schema — the only place either exists is the
        // items JSON on settled bills, so both are derived from there. That also
        // gives a real fallback for the category list when mh_categories is
        // unreadable, and lets the pending list tell which bills are actionable.
        // Newest first and, on top of that, the pending bills by id explicitly.
        // An unordered limit returns arbitrary rows, so a bill settled today
        // could fall outside the sample — and a pending bill whose lines are
        // missing can't be judged actionable.
        const pendIds=(p.data||[]).map(r=>r.bill_id).filter(Boolean);
        const [bb,bp]=await Promise.all([
          sb.from("mh_customers").select("id,items,status").eq("status","settled")
            .order("created_at",{ascending:false}).limit(500),
          pendIds.length
            ? sb.from("mh_customers").select("id,items,status").in("id",pendIds)
            : Promise.resolve({data:[],error:null})
        ]);
        if(!bb.error && bb.data){
          const seen={}, catSeen={}, byBill={};
          (bb.data||[]).concat((bp&&!bp.error&&bp.data)||[]).forEach(b=>{
            let its=b.items;
            if(typeof its==="string"){ try{ its=JSON.parse(its); }catch(e){ its=[]; } }
            const lines=(Array.isArray(its)?its:[]).map(li=>({
              name:String((li&&li.name)||"").trim(),
              category:String((li&&li.category)||"").trim() }));
            byBill[String(b.id)]=lines;
            lines.forEach(li=>{
              if(li.name){ const k=normName(li.name); if(!seen[k]) seen[k]={ name:li.name, category:li.category }; }
              if(li.category){ const ck=normName(li.category); if(!catSeen[ck]) catSeen[ck]=li.category; }
            });
          });
          setMenuRows(Object.values(seen).sort((a,b)=>a.name.localeCompare(b.name)));
          setBillLines(byBill);
          setSeenCats(Object.values(catSeen).sort((a,b)=>a.localeCompare(b)));
        }
      }catch(e){
        // Most likely cause by far: the stock-sync migration hasn't been run.
        setErr(e.message||"Couldn't load sync data. Has the stock-sync migration been applied?");
      }
      setLoading(false);
    },[]);
    useEffect(()=>{ load(); },[load]);

    // Apply one bill. The RPC is idempotent, so retrying is always safe.
    async function applyBill(billId){
      const { data, error } = await sb.rpc("mh_apply_bill_stock",{p_bill_id:billId});
      if(error) throw new Error(error.message);
      return (data && data[0]) || {applied:0,unmapped:0,skipped_reason:null};
    }

    async function syncOne(billId,label){
      setBusy(billId);
      try{
        const r=await applyBill(billId);
        if(r.skipped_reason) toastErr(`Bill ${label}: ${r.skipped_reason}`);
        else if(r.applied) toast(`Bill ${label}: ${r.applied} item${r.applied===1?"":"s"} deducted${r.unmapped?`, ${r.unmapped} still unmapped`:""}`);
        else toast(`Bill ${label}: nothing to deduct${r.unmapped?` — ${r.unmapped} unmapped`:""}`);
        await load(); onChanged && onChanged();
      }catch(e){ toastErr(e.message||"Sync failed"); }
      setBusy("");
    }

    async function syncAll(){
      const list=pendingSplit.act;
      if(!list.length) return;
      if(!confirm(`Apply stock deductions for ${list.length} bill${list.length===1?"":"s"}?`)) return;
      setBusy("all");
      let applied=0, unm=0, failed=0;
      for(const b of list){
        try{ const r=await applyBill(b.bill_id); applied+=r.applied||0; unm+=r.unmapped||0; }
        catch(e){ failed++; }
      }
      if(failed) toastErr(`${applied} deducted, ${failed} bill${failed===1?"":"s"} failed`);
      else toast(`${applied} item${applied===1?"":"s"} deducted${unm?`, ${unm} unmapped`:""}`);
      await load(); onChanged && onChanged();
      setBusy("");
    }

    // Group unmapped log rows by menu name — one mapping fixes every bill that
    // was waiting on that name, so the queue is per-name, not per-bill.
    const gaps=useMemo(()=>{
      const g={};
      unmapped.forEach(r=>{
        const k=r.menu_name||"(unnamed)";
        if(!g[k]) g[k]={menu_name:k, qty:0, bills:new Set(), last:r.created_at};
        g[k].qty+=num(r.bill_qty); g[k].bills.add(r.bill_id);
        if(r.created_at>g[k].last) g[k].last=r.created_at;
      });
      return Object.values(g).sort((a,b)=> b.qty-a.qty);
    },[unmapped]);

    // Create the mapping, then immediately replay every bill it unblocks.
    async function saveMapping(gap){
      const d=draft[gap.menu_name]||{};
      const itemId=d.item_id, ratio=num(d.ratio!=null&&d.ratio!==""?d.ratio:1);
      if(!itemId){ toastErr("Pick an inventory item first"); return; }
      if(!(ratio>0)){ toastErr("Ratio must be greater than zero"); return; }
      setBusy(gap.menu_name);
      try{
        const { error } = await sb.from("mh_item_map").insert({
          menu_name:gap.menu_name, inventory_item_id:itemId,
          qty_per_unit:ratio, created_by:(me&&me.email)||null });
        if(error) throw new Error(error.message);
        let applied=0;
        for(const billId of gap.bills){
          try{ const r=await applyBill(billId); applied+=r.applied||0; }catch(e){}
        }
        toast(`Mapped "${gap.menu_name}" — ${applied} deduction${applied===1?"":"s"} applied to waiting bills`);
        setDraft(o=>{ const n={...o}; delete n[gap.menu_name]; return n; });
        await load(); onChanged && onChanged();
      }catch(e){ toastErr(e.message||"Couldn't save mapping"); }
      setBusy("");
    }

    // Menu names seen on bills that don't already have a mapping — the picker
    // shouldn't offer something already paired.
    const unmappedMenuNames=useMemo(()=>{
      const have=new Set(maps.map(m=> normName(m.menu_name)));
      return menuRows.filter(r=> !have.has(normName(r.name)));
    },[menuRows,maps]);

    // Proactive pairing: same insert as the queue flow, then replay anything
    // already waiting on that name so a back-dated mapping still applies.
    async function saveManualMapping(){
      const name=manual.menu.trim(), ratio=num(manual.ratio!==""?manual.ratio:1);
      if(!name || !manual.item_id) return;
      if(!(ratio>0)){ toastErr("Ratio must be greater than zero"); return; }
      if(maps.some(m=> normName(m.menu_name)===normName(name))){ toastErr("That menu item is already mapped"); return; }
      setBusy("manual");
      try{
        const { error } = await sb.from("mh_item_map").insert({
          menu_name:name, inventory_item_id:manual.item_id,
          qty_per_unit:ratio, created_by:(me&&me.email)||null });
        if(error) throw new Error(error.message);
        const waiting=(gaps.find(g=> normName(g.menu_name)===normName(name))||{}).bills;
        let applied=0;
        if(waiting) for(const billId of waiting){ try{ const r=await applyBill(billId); applied+=r.applied||0; }catch(e){} }
        toast(`Mapped "${name}"${applied?` — ${applied} waiting deduction${applied===1?"":"s"} applied`:""}`);
        setManual({menu:"",item_id:"",ratio:"1"});
        await load(); onChanged && onChanged();
      }catch(e){ toastErr(e.message||"Couldn't save mapping"); }
      setBusy("");
    }

    async function removeMapping(m){
      if(!confirm(`Remove mapping "${m.menu_name}"? Future bills will log it as unmapped until it's mapped again.`)) return;
      setBusy(m.id);
      try{
        const { error } = await sb.from("mh_item_map").delete().eq("id",m.id);
        if(error) throw new Error(error.message);
        toast("Mapping removed"); await load(); onChanged && onChanged();
      }catch(e){ toastErr(e.message||"Couldn't remove mapping"); }
      setBusy("");
    }

    const armed=useMemo(()=> new Set(cats.map(c=>c.name_norm)),[cats]);
    // Categories to show = everything in mh_categories, plus any already armed
    // whose name no longer appears there (renamed/deleted upstream) so it stays
    // visible and can be turned off. Falls back to the legacy list if the table
    // couldn't be read at all.
    const catList=useMemo(()=>{
      const out=[], seen=new Set();
      const push=(label,orphan)=>{ const norm=normName(label); if(!norm||seen.has(norm)) return; seen.add(norm); out.push({norm,label,orphan:!!orphan}); };
      if(allCats.length) catsFromRows(allCats).forEach(c=> push(c));
      else if(seenCats.length) seenCats.forEach(c=> push(c));   // real categories off real bills
      else SYNC_CATS_FALLBACK.forEach(c=> push(c));
      cats.forEach(c=> push(c.name_norm, true));
      return out.sort((a,b)=> a.label.localeCompare(b.label));
    },[allCats,seenCats,cats]);

    // A bill is only worth showing under "Not synced" if it actually has a line
    // in an armed category. Otherwise Apply does nothing and the bill sits in
    // the queue for ever. Bills whose lines we couldn't load are kept visible —
    // better a redundant row than a silently hidden one.
    const pendingSplit=useMemo(()=>{
      // Nothing armed = nothing can be judged inert. Hiding every bill here
      // would make the tab look empty exactly when the operator still has to
      // arm a category, so show them all instead.
      if(armed.size===0) return { act:pending.slice(), inert:[] };
      const act=[], inert=[];
      pending.forEach(b=>{
        const lines=billLines[String(b.bill_id)];
        if(!lines){ act.push(b); return; }
        (lines.some(li=> armed.has(normName(li.category))) ? act : inert).push(b);
      });
      return { act, inert };
    },[pending,billLines,armed]);
    async function toggleCat(name){
      const on=armed.has(name);
      if(on && !confirm(`Stop deducting stock for "${name}"? Bills already deducted are unaffected.`)) return;
      setBusy(name);
      try{
        const { error } = on
          ? await sb.from("mh_stock_categories").delete().eq("name_norm",name)
          : await sb.from("mh_stock_categories").insert({name_norm:name});
        if(error) throw new Error(error.message);
        toast(on?`"${name}" will no longer deduct`:`"${name}" now deducts stock`);
        await load();
      }catch(e){ toastErr(e.message||"Couldn't change category"); }
      setBusy("");
    }

    const itemName=(id)=>{ const it=items.find(x=>x.id===id); return it?it.name:"(item)"; };

    return html`<${Sheet} onClose=${onClose} title="Stock sync">
      ${err && html`<div class="banner net">${err}</div>`}
      ${loading ? html`<div class="empty"><span class="spin"></span><div style=${{marginTop:10}}>Loading…</div></div>` : html`
      <div class="seg" style=${{marginTop:4}}>
        <button class=${tab==="pending"?"on":""} onClick=${()=>setTab("pending")}>Not synced (${pendingSplit.act.length})</button>
        <button class=${tab==="mapping"?"on":""} onClick=${()=>setTab("mapping")}>Mapping (${gaps.length})</button>
        <button class=${tab==="cats"?"on":""} onClick=${()=>setTab("cats")}>Categories</button>
      </div>

      ${tab==="pending" && html`<div>
        <p class="tiny muted" style=${{margin:"12px 2px"}}>
          Settled bills whose stock was never applied — usually settled on an older app build, or the sync call didn't reach the server. Applying is safe to repeat; a bill already deducted won't deduct twice.
        </p>
        ${armed.size===0 && html`<div class="banner net" style=${{margin:"0 0 10px"}}>
          No category is set to deduct stock yet, so applying a bill would do nothing. Arm one under <b>Categories</b> first.
        </div>`}
        ${pendingSplit.inert.length>0 && html`<div class="tiny muted" style=${{margin:"0 2px 10px"}}>
          ${pendingSplit.inert.length} settled bill${pendingSplit.inert.length===1?"":"s"} hidden — nothing on ${pendingSplit.inert.length===1?"it":"them"} belongs to a category that deducts stock, so there is nothing to apply.
        </div>`}
        ${pendingSplit.act.length===0
          ? html`<div class="empty"><${Icon} name="check"/>Every settled bill has been applied.</div>`
          : html`
            <button class="btn" style=${{width:"100%",marginBottom:10}} disabled=${busy==="all"}
              onClick=${syncAll}>${busy==="all"?"Applying…":`Apply all ${pendingSplit.act.length}`}</button>
            ${pendingSplit.act.map(b=> html`<div class="entry" key=${b.bill_id}>
              <span class="dot d"></span>
              <div class="grow">
                <div><b>${b.bill_no?("#"+b.bill_no):"(no number)"}</b> <span class="tiny muted">${b.customer||""}</span></div>
                <div class="tiny muted">${fmtDT(b.bill_date)}</div>
              </div>
              <button class="btn ghost sm" disabled=${!!busy}
                onClick=${()=>syncOne(b.bill_id,b.bill_no||"")}>${busy===b.bill_id?"…":"Apply"}</button>
            </div>`)}`}
      </div>`}

      ${tab==="mapping" && html`<div>
        <p class="tiny muted" style=${{margin:"12px 2px"}}>
          Menu items sold with nowhere to deduct from. These sold without being counted. Map one and every waiting bill is applied straight away.
        </p>
        ${gaps.length===0
          ? html`<div class="empty"><${Icon} name="check"/>Nothing waiting to be mapped.</div>`
          : gaps.map(g=> html`<div class="card" key=${g.menu_name} style=${{marginBottom:10}}>
              <div class="pad">
                <div class="row between" style=${{gap:8}}>
                  <b class="ell">${g.menu_name}</b>
                  <span class="pill low">${num(g.qty)} sold untracked</span>
                </div>
                <div class="tiny muted" style=${{marginTop:2}}>${g.bills.size} bill${g.bills.size===1?"":"s"} waiting · last ${fmtDT(g.last)}</div>
                <div class="row" style=${{gap:8,marginTop:10,flexWrap:"wrap"}}>
                  <select style=${{flex:"1 1 160px"}} value=${(draft[g.menu_name]||{}).item_id||""}
                    onChange=${e=>setDraft(o=>({...o,[g.menu_name]:{...(o[g.menu_name]||{}),item_id:e.target.value}}))}>
                    <option value="">Deduct from…</option>
                    ${items.map(it=> html`<option key=${it.id} value=${it.id}>${it.name}${it.unit?" ("+it.unit+")":""}</option>`)}
                  </select>
                  <input type="number" min="0" step="any" style=${{width:92}} placeholder="ratio"
                    value=${(draft[g.menu_name]||{}).ratio!=null?(draft[g.menu_name]||{}).ratio:"1"}
                    onChange=${e=>setDraft(o=>({...o,[g.menu_name]:{...(o[g.menu_name]||{}),ratio:e.target.value}}))}/>
                  <button class="btn sm" disabled=${busy===g.menu_name}
                    onClick=${()=>saveMapping(g)}>${busy===g.menu_name?"Saving…":"Map & apply"}</button>
                </div>
                <div class="tiny muted" style=${{marginTop:6}}>Ratio = stock units consumed per menu item sold. A pack of 20 against stick-counted stock is 20.</div>
              </div>
            </div>`)}

        <div class="card" style=${{marginTop:14}}><div class="hd"><h3>Add a mapping</h3></div>
          <div class="pad">
            <p class="tiny muted" style=${{margin:"0 0 10px"}}>Pair a menu item up front, before it is ever sold unmapped. Names come from items seen on settled bills; type one in if it hasn't sold yet.</p>
            <label>Menu item</label>
            <input list="gh-menu-names" value=${manual.menu} placeholder="e.g. Aquafina 1L"
              onChange=${e=>setManual(o=>({...o,menu:e.target.value}))}/>
            <datalist id="gh-menu-names">
              ${unmappedMenuNames.map(m=> html`<option key=${m.name} value=${m.name}>${m.category||""}</option>`)}
            </datalist>
            <label>Deduct from</label>
            <select value=${manual.item_id} onChange=${e=>setManual(o=>({...o,item_id:e.target.value}))}>
              <option value="">Pick an inventory item…</option>
              ${items.map(it=> html`<option key=${it.id} value=${it.id}>${it.name}${it.unit?" ("+it.unit+")":""}</option>`)}
            </select>
            <label>Stock units per item sold</label>
            <input type="number" min="0" step="any" value=${manual.ratio}
              onChange=${e=>setManual(o=>({...o,ratio:e.target.value}))}/>
            <div style=${{height:12}}></div>
            <button class="btn" disabled=${busy==="manual"||!manual.menu.trim()||!manual.item_id}
              onClick=${saveManualMapping}>${busy==="manual"?"Saving…":"Add mapping"}</button>
          </div>
        </div>

        <div class="card" style=${{marginTop:14}}><div class="hd"><h3>Existing mappings (${maps.length})</h3></div>
          ${maps.length===0
            ? html`<div class="empty">No mappings yet.</div>`
            : maps.map(m=> html`<div class="entry" key=${m.id}>
                <div class="grow">
                  <div><b class="ell">${m.menu_name}</b></div>
                  <div class="tiny muted">→ ${itemName(m.inventory_item_id)}${num(m.qty_per_unit)!==1?" × "+num(m.qty_per_unit):""}</div>
                </div>
                <button class="btn ghost sm" disabled=${busy===m.id}
                  onClick=${()=>removeMapping(m)}><${Icon} name="x" size=${15}/></button>
              </div>`)}
        </div>
      </div>`}

      ${tab==="cats" && html`<div>
        <p class="tiny muted" style=${{margin:"12px 2px"}}>
          Only these categories deduct stock when a bill is settled. Turning one off takes effect on the next bill; it doesn't undo deductions already made.
        </p>
        ${catList.length===0
          ? html`<div class="empty"><${Icon} name="inbox"/>No categories found in mh_categories.</div>`
          : catList.map(c=>{
          const on=armed.has(c.norm);
          return html`<div class="entry" key=${c.norm}>
            <span class=${"dot "+(on?"c":"")} style=${{background:on?"var(--credit)":"var(--muted)"}}></span>
            <div class="grow">
              <div><b style=${{textTransform:"capitalize"}}>${c.label}</b></div>
              <div class="tiny muted">${on?"deducting stock":"not deducting"}${c.orphan?" · not in mh_categories":""}</div>
            </div>
            <button class=${"btn sm "+(on?"ghost":"")} disabled=${busy===c.norm}
              onClick=${()=>toggleCat(c.norm)}>${busy===c.norm?"…":(on?"Turn off":"Turn on")}</button>
          </div>`;
        })}

        <div class="tiny muted" style=${{margin:"16px 2px 6px",fontWeight:700,textTransform:"uppercase",letterSpacing:".05em"}}>Categories actually on bills</div>
        <p class="tiny muted" style=${{margin:"0 2px 8px"}}>
          The exact <code>category</code> strings found on recent settled bills. A bill only deducts when its string matches an armed name after normalising (lowercase, trimmed, single spaces) — so "Cold Drink" and "Cold Drinks" are different categories, and a near-miss here is why a bill can settle without deducting anything.
        </p>
        ${seenCats.length===0
          ? html`<div class="tiny muted" style=${{margin:"0 2px 10px"}}>No categories seen — bill items may not carry a category field.</div>`
          : seenCats.map(sc=>{
              const on=armed.has(normName(sc));
              return html`<div class="entry" key=${"seen-"+sc}>
                <span class=${"dot "+(on?"c":"d")}></span>
                <div class="grow">
                  <div><b>${sc}</b> <span class="tiny muted">(normalises to "${normName(sc)}")</span></div>
                  <div class="tiny muted">${on?"matches an armed category — will deduct":"no armed category matches — bills with only these lines never deduct"}</div>
                </div>
                ${!on && html`<button class="btn sm" disabled=${busy===normName(sc)}
                  onClick=${()=>toggleCat(normName(sc))}>${busy===normName(sc)?"…":"Turn on"}</button>`}
              </div>`;
            })}
        ${!allCats.length && catErr && html`<div class="banner net" style=${{marginTop:10}}>
          <b>mh_categories unreadable</b> — ${seenCats.length?"listing categories seen on real bills instead.":"falling back to a built-in list."}<br/>
          <span class="tiny">Postgres said: <code>${catErr}</code></span><br/>
          <span class="tiny">"relation does not exist" = wrong table name or schema. "column ... does not exist" = the label column is named something else. Empty result with no error = row-level security is hiding it; grant select to the app role.</span>
        </div>`}
        ${allCats.length>0 && catList.filter(c=>!c.orphan).length===0 && html`<div class="banner net" style=${{marginTop:10}}>
          <b>mh_categories read, but no names could be pulled out of its <code>list</code> column.</b><br/>
          <span class="tiny">First row looks like: <code>${(()=>{ try{ return JSON.stringify(allCats[0]).slice(0,220); }catch(e){ return "(unreadable)"; } })()}</code></span><br/>
          <span class="tiny">Send me that and I'll wire the exact shape.</span>
        </div>`}
        <div class="tiny muted" style=${{margin:"12px 2px"}}>
          ${allCats.length
            ? "Listed from the billing app's mh_categories table."
            : seenCats.length
            ? "Derived from categories actually seen on settled bills."
            : "Built-in fallback list."}
          ${' '}A category with no mappings is harmless — its lines simply queue up under Mapping.
        </div>
      </div>`}
      `}
    </${Sheet}>`;
  }

  function Sheet({title,onClose,children}){
    useEffect(()=>{ const k=(e)=>{ if(e.key==="Escape") onClose(); }; window.addEventListener("keydown",k); return ()=>window.removeEventListener("keydown",k); },[onClose]);
    return html`<div class="scrim" onClick=${onClose}>
      <div class="sheet" onClick=${e=>e.stopPropagation()}>
        <div class="handle"></div>
        <div class="between"><h2>${title}</h2><button class="iconbtn" aria-label="Close" style=${{marginLeft:0}} onClick=${onClose}><${Icon} name="x"/></button></div>
        <div style=${{height:6}}></div>
        ${children}
      </div>
    </div>`;
  }

  try{
    ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
  }catch(e){
    fatal("App failed to start", String((e&&e.message)||e)+"<br><br>Please send me this message and the console error.");
  }
})();
</script>
</body>
</html>
